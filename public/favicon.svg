<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#c4a8d8"/>
      <stop offset="100%" stop-color="#6a5a8e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0c0c14"/>
  <circle cx="16" cy="15" r="8" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="16" cy="15" r="9.5" fill="none" stroke="#2a2a40" stroke-width="0.5"/>
</svg>
