<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src https://tools.penumbraforge.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <title>penumbra snake</title>
    <meta name="description" content="multiplayer snake — webrtc p2p">
    <link rel="canonical" href="https://penumbraforge.com/snake/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { touch-action: manipulation; }

        :root {
            --bg: #07070b;
            --surface: #0b0b11;
            --border: #16162a;
            --text: #6a6a78;
            --text-bright: #8a8a98;
            --text-dim: #2e2e3a;
            --accent: #687a8e;
            --accent-hover: #8a9aae;
            --success: #4d6b4d;
            --error: #8a5555;
            --gold: #8a7a55;
            --bright-gold: #c8a858;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 1px,
                rgba(0, 0, 0, 0.02) 1px, rgba(0, 0, 0, 0.02) 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        .game-container {
            width: 100%;
            max-width: 760px;
            height: 100vh;
            height: 100dvh;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .game-header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .header-dots {
            display: flex;
            gap: 6px;
        }

        .header-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }

        .header-back {
            color: var(--text-dim);
            cursor: pointer;
            font-size: 11px;
            text-decoration: none;
            transition: color 0.15s;
            letter-spacing: 0.05em;
        }
        .header-back:hover { color: var(--text-bright); }

        .game-hud {
            padding: 4px 10px;
            font-size: 11px;
            color: var(--text);
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .hp-full { color: var(--success); }
        .hp-mid { color: var(--gold); }
        .hp-low { color: var(--error); }

        .game-messages {
            padding: 2px 10px;
            font-size: 10px;
            line-height: 1.4;
            color: var(--text);
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 18px;
            max-height: 36px;
            overflow: hidden;
        }

        .canvas-area {
            flex: 1;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .game-status {
            padding: 3px 10px;
            font-size: 10px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            letter-spacing: 0.03em;
        }

        .overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(7, 7, 11, 0.92);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay.active { display: flex; }

        .overlay-box {
            max-width: 520px;
            width: 100%;
            font-size: 12px;
            line-height: 1.7;
        }

        .overlay-box pre {
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            white-space: pre-wrap;
        }

        .boot-screen {
            position: absolute;
            inset: 0;
            background: var(--surface);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 30px;
            font-size: 12px;
            line-height: 1.6;
        }
        .boot-screen.hidden { display: none; }

        .touch-controls {
            display: none;
            padding: 6px;
            padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
            background: rgba(7, 7, 11, 0.9);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            max-width: 240px;
            margin: 0 auto;
        }

        .dpad button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-bright);
            font-family: inherit;
            font-size: 20px;
            min-height: 48px;
            padding: 12px 0;
            border-radius: 6px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .dpad button:active {
            background: var(--border);
        }
        .dpad button.empty {
            visibility: hidden;
        }

        .s1 { color: #6a8f6a; }
        .s2 { color: #8a9aae; }
        .gld { color: var(--bright-gold); }
        .dim { color: var(--text-dim); }
        .bright { color: var(--text-bright); }

        .overlay-touch-btns {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
            gap: 8px;
        }

        .overlay-touch-btn {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-bright);
            font-family: inherit;
            font-size: 13px;
            min-height: 44px;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay-touch-btn:active { background: var(--border); }
        .overlay-touch-btn.accent {
            border-color: var(--accent);
            color: var(--accent-hover);
        }

        .room-input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-bright);
            font-family: inherit;
            font-size: 16px;
            padding: 6px 10px;
            width: 80px;
            text-align: center;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            outline: none;
        }
        .room-input:focus { border-color: var(--accent); }

        @media (max-width: 640px) {
            .game-container { border: none; }
        }

        @media (pointer: coarse) {
            .touch-controls { display: block; }
            .overlay-touch-btn { display: inline-block; }
            .overlay-touch-btns { display: flex; }
            .overlay-box { font-size: 11px; }
            .game-header { padding: 5px 12px; }
            .game-hud { padding: 2px 10px; }
            .game-status { padding: 2px 10px; font-size: 9px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="boot-screen" id="bootScreen"></div>

        <div class="game-header">
            <div class="header-dots"><span></span><span></span><span></span></div>
            <div class="header-title">penumbra snake</div>
            <a class="header-back" href="/">[ forge ]</a>
        </div>
        <div class="game-hud" id="hud">
            <div class="hud-row">
                <span id="hudLeft">score: 0</span>
                <span id="hudRight">hi: 0</span>
            </div>
        </div>
        <div class="canvas-area" id="canvasArea">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="game-messages" id="messages"></div>
        <div class="game-status" id="statusBar">loading...</div>

        <div class="overlay" id="overlay">
            <div class="overlay-box"><pre id="overlayContent"></pre></div>
            <div class="overlay-touch-btns" id="overlayBtns"></div>
        </div>

        <div class="touch-controls" id="touchControls">
            <div class="dpad">
                <button class="empty" disabled aria-hidden="true" tabindex="-1"></button>
                <button data-dir="up" aria-label="Move up">&#x2191;</button>
                <button class="empty" disabled aria-hidden="true" tabindex="-1"></button>
                <button data-dir="left" aria-label="Move left">&#x2190;</button>
                <button class="empty" disabled aria-hidden="true" tabindex="-1"></button>
                <button data-dir="right" aria-label="Move right">&#x2192;</button>
                <button class="empty" disabled aria-hidden="true" tabindex="-1"></button>
                <button data-dir="down" aria-label="Move down">&#x2193;</button>
                <button class="empty" disabled aria-hidden="true" tabindex="-1"></button>
            </div>
        </div>
    </div>

<script>
// ============================================================
// PENUMBRA SNAKE — Single Player + WebRTC Multiplayer
// ============================================================

(function() {
'use strict';

// --- Constants ---
const GRID = 30;
const SIGNAL_URL = 'https://tools.penumbraforge.com/api/signal';
const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
];

const COLORS = {
    bg: '#07070b',
    grid: '#0c0c12',
    snake1: '#4d6b4d',
    snake1Head: '#7aaf7a',
    snake2: '#687a8e',
    snake2Head: '#9abace',
    food: '#8a7a55',
    foodPulse: '#c8a858',
    textDim: '#2e2e3a',
    text: '#6a6a78',
    accent: '#687a8e',
    success: '#4d6b4d',
    gold: '#c8a858',
    border: '#16162a',
};

// --- State ---
const State = { BOOT: 0, TITLE: 1, LOBBY: 2, PLAYING: 3, GAME_OVER: 4 };
let gameState = State.BOOT;
let mode = 'solo'; // 'solo' or 'multi'
let isHost = false;

// Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const canvasArea = document.getElementById('canvasArea');
let cellSize = 0;

// Game vars
let snake1, snake2, food, score1, score2, alive1, alive2;
let tickRate, tickTimer, tickCount;
let highScore = parseInt(localStorage.getItem('penumbra_snake_hi') || '0');
let dirQueue1 = [];
let dirQueue2 = [];

// Multiplayer
let pc = null;       // RTCPeerConnection
let dc = null;       // RTCDataChannel
let roomCode = '';
let peerConnected = false;
let rematchSent = false;
let rematchReceived = false;
let countdownValue = 0;
let lobbyState = 'menu'; // 'menu', 'hosting', 'joining', 'connecting'
let joinInput = '';

// DOM
const hud = document.getElementById('hud');
const hudLeft = document.getElementById('hudLeft');
const hudRight = document.getElementById('hudRight');
const statusBar = document.getElementById('statusBar');
const msgEl = document.getElementById('messages');
const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const bootScreen = document.getElementById('bootScreen');

// Message log
const messageLog = [];
function logMsg(text, color) {
    messageLog.push({ text, color: color || '#6a6a78' });
    if (messageLog.length > 3) messageLog.shift();
    renderMessages();
}
function renderMessages() {
    msgEl.innerHTML = messageLog.map(m =>
        `<div style="color:${m.color}">${m.text}</div>`
    ).join('');
}

// --- Direction helpers ---
const DIR = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 },
};

const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

function lastQueuedDir(queue, current) {
    return queue.length > 0 ? queue[queue.length - 1] : current;
}

function queueDirection(queue, newDir, currentDir) {
    if (queue.length >= 2) return;
    const effective = lastQueuedDir(queue, currentDir);
    if (newDir === effective || newDir === OPPOSITE[effective]) return;
    queue.push(newDir);
}

// --- Canvas setup ---
function resizeCanvas() {
    const area = canvasArea;
    const w = area.clientWidth;
    const h = area.clientHeight;
    cellSize = Math.floor(Math.min(w, h) / GRID);
    const size = cellSize * GRID;
    canvas.width = size;
    canvas.height = size;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    render();
}

window.addEventListener('resize', resizeCanvas);

// --- Rendering ---
let foodPulsePhase = 0;

function render() {
    if (!cellSize) return;
    const W = canvas.width;
    const H = canvas.height;

    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
        const p = i * cellSize + 0.5;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(W, p); ctx.stroke();
    }

    if (gameState !== State.PLAYING && gameState !== State.GAME_OVER) return;

    // Food
    if (food) {
        foodPulsePhase += 0.05;
        const pulse = 0.5 + 0.5 * Math.sin(foodPulsePhase);
        const r1 = parseInt(COLORS.food.slice(1, 3), 16);
        const g1 = parseInt(COLORS.food.slice(3, 5), 16);
        const b1 = parseInt(COLORS.food.slice(5, 7), 16);
        const r2 = parseInt(COLORS.foodPulse.slice(1, 3), 16);
        const g2 = parseInt(COLORS.foodPulse.slice(3, 5), 16);
        const b2 = parseInt(COLORS.foodPulse.slice(5, 7), 16);
        const r = Math.round(r1 + (r2 - r1) * pulse);
        const g = Math.round(g1 + (g2 - g1) * pulse);
        const b = Math.round(b1 + (b2 - b1) * pulse);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(food.x * cellSize + 1, food.y * cellSize + 1, cellSize - 2, cellSize - 2);
    }

    // Draw snake
    function drawSnake(segments, bodyColor, headColor, alive) {
        if (!segments || segments.length === 0) return;
        const alpha = alive ? 1.0 : 0.3;
        for (let i = segments.length - 1; i >= 0; i--) {
            const s = segments[i];
            const isHead = (i === 0);
            ctx.fillStyle = isHead ? headColor : bodyColor;
            ctx.globalAlpha = alpha;
            const pad = isHead ? 0 : 1;
            ctx.fillRect(s.x * cellSize + pad, s.y * cellSize + pad, cellSize - pad * 2, cellSize - pad * 2);
        }
        ctx.globalAlpha = 1.0;
    }

    if (snake1) drawSnake(snake1.segments, COLORS.snake1, COLORS.snake1Head, alive1);
    if (snake2) drawSnake(snake2.segments, COLORS.snake2, COLORS.snake2Head, alive2);
}

// --- Food placement ---
function spawnFood() {
    const occupied = new Set();
    if (snake1) snake1.segments.forEach(s => occupied.add(s.x + ',' + s.y));
    if (snake2) snake2.segments.forEach(s => occupied.add(s.x + ',' + s.y));

    const free = [];
    for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
            if (!occupied.has(x + ',' + y)) free.push({ x, y });
        }
    }
    if (free.length === 0) return;
    food = free[Math.floor(Math.random() * free.length)];
}

// --- Game init ---
function initSnake(startX, startY, dir, length) {
    const segments = [];
    const d = DIR[dir];
    for (let i = 0; i < (length || 3); i++) {
        segments.push({ x: startX - d.x * i, y: startY - d.y * i });
    }
    return { segments, dir };
}

function startGame() {
    snake1 = initSnake(5, 5, 'right');
    score1 = 0;
    alive1 = true;
    dirQueue1 = [];

    if (mode === 'multi') {
        snake2 = initSnake(24, 24, 'left');
        score2 = 0;
        alive2 = true;
        dirQueue2 = [];
        tickRate = 10;
    } else {
        snake2 = null;
        score2 = 0;
        alive2 = false;
        tickRate = 8;
    }

    food = null;
    spawnFood();
    tickCount = 0;
    foodPulsePhase = 0;
    gameState = State.PLAYING;
    hideOverlay();
    messageLog.length = 0;
    logMsg(mode === 'multi' ? 'match started.' : 'entering the grid...', '#687a8e');
    updateHUD();
    startTicking();
}

function startTicking() {
    stopTicking();
    tickTimer = setInterval(tick, Math.round(1000 / tickRate));
}

function stopTicking() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
}

// --- Game tick ---
function tick() {
    if (gameState !== State.PLAYING) return;

    // If multiplayer and we're the joiner, host sends state — don't tick locally
    if (mode === 'multi' && !isHost) return;

    // Process direction queues
    if (dirQueue1.length > 0 && alive1) snake1.dir = dirQueue1.shift();
    if (mode === 'multi' && dirQueue2.length > 0 && alive2) snake2.dir = dirQueue2.shift();

    // Move snakes
    function moveSnake(snake) {
        const head = snake.segments[0];
        const d = DIR[snake.dir];
        return { x: head.x + d.x, y: head.y + d.y };
    }

    let newHead1 = alive1 ? moveSnake(snake1) : null;
    let newHead2 = (mode === 'multi' && alive2) ? moveSnake(snake2) : null;

    // Check wall collision
    function hitsWall(h) {
        return h.x < 0 || h.x >= GRID || h.y < 0 || h.y >= GRID;
    }

    // Check body collision (with all segments except tails that might move)
    function hitsBody(h, s1, s2) {
        // Check against snake1 body (excluding last segment which will move)
        if (s1) {
            for (let i = 0; i < s1.segments.length - 1; i++) {
                const s = s1.segments[i];
                if (h.x === s.x && h.y === s.y) return true;
            }
        }
        if (s2) {
            for (let i = 0; i < s2.segments.length - 1; i++) {
                const s = s2.segments[i];
                if (h.x === s.x && h.y === s.y) return true;
            }
        }
        return false;
    }

    // Check head-to-head collision in multiplayer
    let headCollision = false;
    if (newHead1 && newHead2 && newHead1.x === newHead2.x && newHead1.y === newHead2.y) {
        headCollision = true;
    }

    if (alive1 && newHead1) {
        if (hitsWall(newHead1) || hitsBody(newHead1, snake1, snake2) || headCollision) {
            alive1 = false;
        }
    }
    if (alive2 && newHead2) {
        if (hitsWall(newHead2) || hitsBody(newHead2, snake2, snake1) || headCollision) {
            alive2 = false;
        }
    }

    // Apply movement for alive snakes
    let ate1 = false, ate2 = false;
    if (alive1 && newHead1) {
        snake1.segments.unshift(newHead1);
        if (food && newHead1.x === food.x && newHead1.y === food.y) {
            ate1 = true;
            score1 += 10;
        } else {
            snake1.segments.pop();
        }
    }
    if (alive2 && newHead2) {
        snake2.segments.unshift(newHead2);
        if (food && newHead2.x === food.x && newHead2.y === food.y) {
            ate2 = true;
            score2 += 10;
        } else {
            snake2.segments.pop();
        }
    }

    if (ate1 || ate2) {
        spawnFood();
        if (ate1) logMsg(`+10 pts. length: ${snake1.segments.length}`, '#4d6b4d');
        if (ate2) logMsg('opponent ate food.', '#687a8e');
        // Speed up in solo mode
        if (mode === 'solo' && ate1) {
            tickCount++;
            if (tickCount % 5 === 0 && tickRate < 15) {
                tickRate += 0.5;
                startTicking();
                logMsg(`speed increased to ${tickRate.toFixed(1)}.`, '#c8a858');
            }
        }
    }

    // Check game over
    let gameOver = false;
    if (mode === 'solo') {
        if (!alive1) gameOver = true;
    } else {
        if (!alive1 || !alive2) gameOver = true;
    }

    // Broadcast state if host
    if (mode === 'multi' && isHost && dc && dc.readyState === 'open') {
        try {
            dc.send(JSON.stringify({
                type: 'state',
                tick: tickCount,
                snakes: [
                    { segments: snake1.segments, alive: alive1, score: score1, dir: snake1.dir },
                    { segments: snake2.segments, alive: alive2, score: score2, dir: snake2.dir },
                ],
                food,
            }));
        } catch(e) {}
    }

    if (gameOver) {
        stopTicking();
        gameState = State.GAME_OVER;
        if (mode === 'solo') logMsg('you crashed.', '#8a5555');
        else if (!alive1 && alive2) logMsg('you were eliminated.', '#8a5555');
        else if (alive1 && !alive2) logMsg('opponent eliminated.', '#4d6b4d');
        else logMsg('mutual destruction.', '#8a5555');

        if (mode === 'solo' && score1 > highScore) {
            highScore = score1;
            localStorage.setItem('penumbra_snake_hi', String(highScore));
        }

        if (mode === 'multi' && isHost && dc && dc.readyState === 'open') {
            let winner = 'draw';
            if (alive1 && !alive2) winner = 'host';
            else if (!alive1 && alive2) winner = 'joiner';
            try {
                dc.send(JSON.stringify({
                    type: 'gameover',
                    winner,
                    scores: [score1, score2],
                }));
            } catch(e) {}
        }

        rematchSent = false;
        rematchReceived = false;
        showGameOver();
    }

    updateHUD();
    render();
}

// --- HUD ---
function updateHUD() {
    if (mode === 'solo') {
        const len = snake1 ? snake1.segments.length : 3;
        const barW = 8;
        const filled = Math.min(barW, Math.floor(len / 3));
        const bar = `<span class="hp-full">${'\u2588'.repeat(filled)}</span><span style="color:var(--text-dim)">${'\u2591'.repeat(barW - filled)}</span>`;
        hudLeft.innerHTML = `<span class="s1">\u2588</span> ${score1 || 0}pts [${bar}] spd:${tickRate.toFixed(1)}`;
        hudRight.textContent = `hi:${highScore}`;
    } else {
        hudLeft.innerHTML = `<span class="s1">\u2588</span> ${score1 || 0}`;
        hudRight.innerHTML = `<span class="s2">\u2588</span> ${score2 || 0}`;
    }
}

    bootScreen.innerHTML = '';

        if (i >= lines.length) {
            setTimeout(() => {
                bootScreen.classList.add('hidden');
                resizeCanvas();
                showTitle();
            }, 400);
            return;
        }
        const line = lines[i];

        i++;
        total += line.delay;
        setTimeout(showNext, line.delay);
    }
    showNext();
}

// --- Input ---
document.addEventListener('keydown', function(e) {
    const key = e.key.toLowerCase();

    // Direction input during play
    if (gameState === State.PLAYING) {
        let dir = null;
        if (key === 'arrowup' || key === 'w') dir = 'up';
        else if (key === 'arrowdown' || key === 's') dir = 'down';
        else if (key === 'arrowleft' || key === 'a') dir = 'left';
        else if (key === 'arrowright' || key === 'd') dir = 'right';

        if (dir) {
            e.preventDefault();
            if (mode === 'solo' || isHost) {
                // Player 1 (local)
                queueDirection(dirQueue1, dir, snake1.dir);
            } else {
                // Joiner sends input to host
                if (dc && dc.readyState === 'open') {
                    try { dc.send(JSON.stringify({ type: 'input', dir })); } catch(e) {}
                }
            }
            return;
        }
    }

    // Title screen
    if (gameState === State.TITLE) {
        if (key === 'enter') { e.preventDefault(); mode = 'solo'; startGame(); return; }
        if (key === 'm') { e.preventDefault(); showLobby(); return; }
    }

    // Lobby
    if (gameState === State.LOBBY) {
        if (lobbyState === 'menu') {
            if (key === 'h') { e.preventDefault(); showHosting(); return; }
            if (key === 'j') { e.preventDefault(); showJoinPrompt(); return; }
            if (key === 'escape') { e.preventDefault(); showTitle(); return; }
        }
        if (lobbyState === 'joining') {
            if (key === 'escape') { e.preventDefault(); showLobby(); return; }
            if (key === 'backspace') {
                e.preventDefault();
                joinInput = joinInput.slice(0, -1);
                renderJoinPrompt();
                return;
            }
            if (key === 'enter' && joinInput.length === 4) {
                e.preventDefault();
                startJoining(joinInput.toUpperCase());
                return;
            }
            if (/^[a-z0-9]$/i.test(key) && joinInput.length < 4) {
                e.preventDefault();
                joinInput += key.toUpperCase();
                renderJoinPrompt();
                return;
            }
        }
        if (lobbyState === 'hosting' || lobbyState === 'connecting') {
            if (key === 'escape') { e.preventDefault(); cleanupMultiplayer(); showLobby(); return; }
        }
    }

    // Game over
    if (gameState === State.GAME_OVER) {
        if (key === 'escape') { e.preventDefault(); showTitle(); return; }
        if (key === 'enter') {
            e.preventDefault();
            if (mode === 'solo') {
                startGame();
            } else if (peerConnected) {
                requestRematch();
            }
            return;
        }
    }
});

// --- Swipe detection ---
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', function(e) {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
}, { passive: true });

canvas.addEventListener('touchend', function(e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const threshold = 30;

    if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

    let dir;
    if (Math.abs(dx) > Math.abs(dy)) {
        dir = dx > 0 ? 'right' : 'left';
    } else {
        dir = dy > 0 ? 'down' : 'up';
    }
    handleDirectionInput(dir);
});

// --- WebRTC Multiplayer ---
function cleanupMultiplayer() {
    if (dc) { try { dc.close(); } catch(e) {} dc = null; }
    if (pc) { try { pc.close(); } catch(e) {} pc = null; }
    peerConnected = false;
    roomCode = '';
    rematchSent = false;
    rematchReceived = false;
}

async function waitForICE(connection) {
    if (connection.iceGatheringState === 'complete') return;
    return new Promise(resolve => {
        const timeout = setTimeout(resolve, 2000);
        connection.addEventListener('icegatheringstatechange', function check() {
            if (connection.iceGatheringState === 'complete') {
                clearTimeout(timeout);
                connection.removeEventListener('icegatheringstatechange', check);
                resolve();
            }
        });
    });
}

async function startHosting() {
    mode = 'multi';
    isHost = true;
    cleanupMultiplayer();

    try {
        pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        dc = pc.createDataChannel('game', { ordered: true });
        setupDataChannel(dc);

        pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                handleDisconnect();
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForICE(pc);

        const sdp = pc.localDescription.sdp;
        const res = await fetch(`${SIGNAL_URL}/room`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ offer: sdp }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Failed to create room');

        roomCode = data.room;
        showOverlay([
            '',
            '  <span class="bright">┌─ room created ─────────────┐</span>',
            '  <span class="bright">│</span>',
            `  <span class="bright">│</span>  code: <span class="gld" style="font-size:18px;letter-spacing:0.15em">${roomCode}</span>`,
            '  <span class="bright">│</span>',
            '  <span class="bright">│</span>  <span class="dim">share this code with player 2</span>',
            '  <span class="bright">│</span>  <span class="dim">waiting for opponent...</span>',
            '  <span class="bright">│</span>',
            '  <span class="bright">│</span>  <span class="bright">[esc]</span>  cancel',
            '  <span class="bright">└────────────────────────────┘</span>',
        ].join('\n'));
        addOverlayBtn('cancel', () => { cleanupMultiplayer(); showLobby(); });
        statusBar.textContent = `room: ${roomCode} — waiting for player 2`;

        // Poll for answer
        pollForAnswer();

    } catch(err) {
        showOverlay([
            '',
            '  <span style="color:#8a5555">┌─ connection error ─────────┐</span>',
            '  <span style="color:#8a5555">│</span>',
            `  <span style="color:#8a5555">│</span>  <span class="dim">${err.message || 'unknown error'}</span>`,
            '  <span style="color:#8a5555">│</span>',
            '  <span style="color:#8a5555">│</span>  <span class="bright">[esc]</span>  back',
            '  <span style="color:#8a5555">└────────────────────────────┘</span>',
        ].join('\n'));
        addOverlayBtn('back', () => { showLobby(); });
        statusBar.textContent = 'error';
    }
}

async function pollForAnswer() {
    const code = roomCode;
    for (let i = 0; i < 120; i++) { // 60 seconds max
        if (!pc || roomCode !== code || gameState !== State.LOBBY) return;
        try {
            const res = await fetch(`${SIGNAL_URL}/room/${code}`);
            const data = await res.json();
            if (data.answer) {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.answer }));
                lobbyState = 'connecting';
                statusBar.textContent = 'connecting...';
                return;
            }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 500));
    }
    // Timeout
    if (gameState === State.LOBBY) {
        showOverlay([
            '',
            '  <span class="dim">┌─ timeout ──────────────────┐</span>',
            '  <span class="dim">│</span>',
            '  <span class="dim">│  room expired. no one joined.</span>',
            '  <span class="dim">│</span>',
            '  <span class="dim">│</span>  <span class="bright">[esc]</span>  back',
            '  <span class="dim">└────────────────────────────┘</span>',
        ].join('\n'));
        addOverlayBtn('back', () => { showLobby(); });
    }
}

async function startJoining(code) {
    mode = 'multi';
    isHost = false;
    cleanupMultiplayer();
    lobbyState = 'connecting';

    showOverlay([
        '',
        '  <span class="bright">┌─ joining ──────────────────┐</span>',
        '  <span class="bright">│</span>',
        `  <span class="bright">│</span>  room <span class="gld">${code}</span> ...`,
        '  <span class="bright">│</span>  <span class="dim">connecting to host</span>',
        '  <span class="bright">└────────────────────────────┘</span>',
    ].join('\n'));
    statusBar.textContent = `joining ${code}...`;

    try {
        // Get offer
        const res = await fetch(`${SIGNAL_URL}/room/${code}`);
        if (!res.ok) throw new Error('Room not found');
        const data = await res.json();
        if (!data.offer) throw new Error('Room not found');

        pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

        pc.ondatachannel = function(e) {
            dc = e.channel;
            setupDataChannel(dc);
        };

        pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                handleDisconnect();
            }
        };

        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.offer }));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await waitForICE(pc);

        const sdp = pc.localDescription.sdp;
        const ansRes = await fetch(`${SIGNAL_URL}/room/${code}/answer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answer: sdp }),
        });
        const ansData = await ansRes.json();
        if (!ansData.ok) throw new Error(ansData.error || 'Failed to submit answer');

        roomCode = code;
        statusBar.textContent = 'connecting...';

    } catch(err) {
        showOverlay([
            '',
            '  <span style="color:#8a5555">┌─ connection error ─────────┐</span>',
            '  <span style="color:#8a5555">│</span>',
            `  <span style="color:#8a5555">│</span>  <span class="dim">${err.message || 'unknown error'}</span>`,
            '  <span style="color:#8a5555">│</span>',
            '  <span style="color:#8a5555">│</span>  <span class="bright">[esc]</span>  back',
            '  <span style="color:#8a5555">└────────────────────────────┘</span>',
        ].join('\n'));
        addOverlayBtn('back', () => { showLobby(); });
        statusBar.textContent = 'error';
        lobbyState = 'hosting'; // allow esc
    }
}

function setupDataChannel(channel) {
    channel.onopen = function() {
        peerConnected = true;
        statusBar.textContent = 'connected! starting game...';

        if (isHost) {
            // Start countdown
            countdownValue = 3;
            runCountdown();
        }
    };

    channel.onclose = function() {
        handleDisconnect();
    };

    channel.onmessage = function(e) {
        try {
            const msg = JSON.parse(e.data);
            handlePeerMessage(msg);
        } catch(e) {}
    };
}

function runCountdown() {
    if (countdownValue <= 0) {
        startGame();
        return;
    }

    showOverlay([
        '',
        '',
        `  <span class="bright" style="font-size:24px">${countdownValue}</span>`,
        '',
    ].join('\n'));

    if (isHost && dc && dc.readyState === 'open') {
        try { dc.send(JSON.stringify({ type: 'countdown', value: countdownValue })); } catch(e) {}
    }

    setTimeout(() => {
        countdownValue--;
        runCountdown();
    }, 800);
}

function handlePeerMessage(msg) {
    switch (msg.type) {
        case 'input':
            // Host receives joiner direction
            if (isHost && snake2) {
                queueDirection(dirQueue2, msg.dir, snake2.dir);
            }
            break;

        case 'state':
            // Joiner receives game state from host
            if (!isHost) {
                if (msg.snakes && msg.snakes.length >= 2) {
                    if (!snake1) snake1 = { segments: [], dir: 'right' };
                    if (!snake2) snake2 = { segments: [], dir: 'left' };
                    snake1.segments = msg.snakes[0].segments;
                    alive1 = msg.snakes[0].alive;
                    score1 = msg.snakes[0].score;
                    snake1.dir = msg.snakes[0].dir;
                    snake2.segments = msg.snakes[1].segments;
                    alive2 = msg.snakes[1].alive;
                    score2 = msg.snakes[1].score;
                    snake2.dir = msg.snakes[1].dir;
                }
                food = msg.food;
                gameState = State.PLAYING;
                hideOverlay();
                updateHUD();
                render();
            }
            break;

        case 'gameover':
            if (!isHost) {
                gameState = State.GAME_OVER;
                stopTicking();
                if (msg.scores) { score1 = msg.scores[0]; score2 = msg.scores[1]; }
                if (msg.winner === 'host') { alive1 = true; alive2 = false; }
                else if (msg.winner === 'joiner') { alive1 = false; alive2 = true; }
                else { alive1 = false; alive2 = false; }
                rematchSent = false;
                rematchReceived = false;
                updateHUD();
                render();
                showGameOver();
            }
            break;

        case 'countdown':
            if (!isHost) {
                showOverlay([
                    '',
                    '',
                    `  <span class="bright" style="font-size:24px">${msg.value}</span>`,
                    '',
                ].join('\n'));
                if (msg.value <= 0) {
                    hideOverlay();
                }
            }
            break;

        case 'rematch':
            rematchReceived = true;
            if (rematchSent && rematchReceived) {
                // Both want rematch
                if (isHost) {
                    countdownValue = 3;
                    runCountdown();
                }
            } else {
                showOverlay([
                    '',
                    '  <span class="bright">┌─ rematch ──────────────────┐</span>',
                    '  <span class="bright">│</span>',
                    '  <span class="bright">│  opponent wants a rematch!</span>',
                    '  <span class="bright">│</span>',
                    '  <span class="bright">│</span>  <span class="bright">[enter]</span>  accept',
                    '  <span class="bright">│</span>  <span class="bright">[esc]</span>    title screen',
                    '  <span class="bright">└────────────────────────────┘</span>',
                ].join('\n'));
                addOverlayBtn('accept', () => { requestRematch(); }, true);
                addOverlayBtn('title screen', () => { showTitle(); });
            }
            break;
    }
}

function requestRematch() {
    if (rematchSent) return;
    rematchSent = true;
    if (dc && dc.readyState === 'open') {
        try { dc.send(JSON.stringify({ type: 'rematch' })); } catch(e) {}
    }
    if (rematchSent && rematchReceived) {
        if (isHost) {
            countdownValue = 3;
            runCountdown();
        }
    } else {
        showOverlay([
            '',
            '  <span class="dim">┌─ rematch ──────────────────┐</span>',
            '  <span class="dim">│</span>',
            '  <span class="dim">│  rematch requested...</span>',
            '  <span class="dim">│  waiting for opponent</span>',
            '  <span class="dim">│</span>',
            '  <span class="dim">│</span>  <span class="bright">[esc]</span>  title screen',
            '  <span class="dim">└────────────────────────────┘</span>',
        ].join('\n'));
        addOverlayBtn('title screen', () => { showTitle(); });
        statusBar.textContent = 'waiting for rematch...';
    }
}

function handleDisconnect() {
    peerConnected = false;
    if (gameState === State.PLAYING) {
        stopTicking();
        gameState = State.GAME_OVER;
        showOverlay([
            '',
            '  <span style="color:#8a5555">┌─ disconnected ─────────────┐</span>',
            '  <span style="color:#8a5555">│</span>',
            '  <span style="color:#8a5555">│  opponent disconnected</span>',
            '  <span style="color:#8a5555">│</span>',
            '  <span style="color:#8a5555">│</span>  <span class="bright">[esc]</span>  title screen',
            '  <span style="color:#8a5555">└────────────────────────────┘</span>',
        ].join('\n'));
        addOverlayBtn('title screen', () => { showTitle(); });
        statusBar.textContent = 'disconnected';
    }
}

// --- Animation loop (for food pulse only, game logic is tick-based) ---
function animLoop() {
    if (gameState === State.PLAYING) {
        render();
    }
    requestAnimationFrame(animLoop);
}

// --- Init ---
resizeCanvas();
runBoot();
requestAnimationFrame(animLoop);

})();
</script>
</body>
</html>
