                                .replace(/: (\d+)/g, ': <span class="line-bright">$1</span>')
                                .replace(/: (true|false|null)/g, ': <span class="line-error">$1</span>');
                            this.addLine('  ' + highlighted);
                        });
                    } catch (e) { this.addLine('  <span class="line-error">invalid JSON</span>'); }
                } else if (action === 'json' && sub === 'path') {
                    try {
                        const pathStr = rest[0];
                        const jsonStr = rest.slice(1).join(' ');
                        const obj = JSON.parse(jsonStr);
                        const keys = pathStr.split('.');
                        let val = obj;
                        for (const k of keys) {
                            if (val == null) break;
                            val = val[k];
                        }
                        if (val === undefined) {
                            this.addLine('  <span class="dim">undefined</span>');
                        } else if (typeof val === 'object') {
                            this.addCopyable('  ' + escapeHtml(JSON.stringify(val, null, 2).split('\n').join('\n  ')), JSON.stringify(val));
                        } else {
                            this.addCopyable('  ' + escapeHtml(String(val)), String(val));
                        }
                    } catch (e) { this.addLine('  <span class="line-error">usage: json path &lt;dot.path&gt; &lt;json&gt;</span>'); }
                } else if (action === 'json' && sub === 'minify') {
                    try { const r = JSON.stringify(JSON.parse(rest.join(' '))); this.addCopyable('  ' + escapeHtml(r), r); }
                    catch (e) { this.addLine('  <span class="line-error">invalid JSON</span>'); }
                } else if (action === 'json' && sub === 'diff') {
                    try {
                        const full = rest.join(' ');
                        const sepIdx = full.indexOf(' -- ');
                        if (sepIdx < 0) { this.addLine('  usage: json diff &lt;json1&gt; -- &lt;json2&gt;'); this.addLine(''); return; }
                        const obj1 = JSON.parse(full.slice(0, sepIdx));
                        const obj2 = JSON.parse(full.slice(sepIdx + 4));
                        const allKeys = new Set([...Object.keys(obj1), ...Object.keys(obj2)]);
                        let diffs = 0;
                        for (const k of [...allKeys].sort()) {
                            const v1 = JSON.stringify(obj1[k]), v2 = JSON.stringify(obj2[k]);
                            if (v1 === v2) {
                                this.addLine(`  <span class="dim"> </span> <span class="line-accent">"${escapeHtml(k)}"</span>: ${escapeHtml(v1 || 'undefined')}`);
                            } else {
                                diffs++;
                                if (v1 !== undefined) this.addLine(`  <span class="line-error">-</span> <span class="line-accent">"${escapeHtml(k)}"</span>: ${escapeHtml(v1)}`);
                                if (v2 !== undefined) this.addLine(`  <span class="line-success">+</span> <span class="line-accent">"${escapeHtml(k)}"</span>: ${escapeHtml(v2)}`);
                            }
                        }
                        this.addLine('');
                        this.addLine(diffs === 0 ? '  <span class="line-success">identical</span>' : `  <span class="line-bright">${diffs} difference${diffs>1?'s':''}</span>`);
                    } catch (e) { this.addLine('  <span class="line-error">invalid JSON: ' + escapeHtml(e.message) + '</span>'); }
                } else if (action === 'json' && sub === 'schema') {
                    try {
                        const obj = JSON.parse(rest.join(' '));
                        const infer = (val, indent) => {
                            if (val === null) return 'null';
                            if (Array.isArray(val)) {
                                if (val.length === 0) return 'Array<unknown>';
                                return `Array<${infer(val[0], indent)}>`;
                            }
                            if (typeof val === 'object') {
                                const entries = Object.entries(val);
                                if (entries.length === 0) return '{}';
                                const lines = entries.map(([k, v]) => `${indent}  <span class="line-accent">"${escapeHtml(k)}"</span>: ${infer(v, indent + '  ')}`);
                                return `{\n${lines.join(',\n')}\n${indent}}`;
                            }
                            return `<span class="line-bright">${typeof val}</span>`;
                        };
                        this.addLine('');
                        infer(obj, '  ').split('\n').forEach(l => this.addLine('  ' + l));
                    } catch (e) { this.addLine('  <span class="line-error">invalid JSON</span>'); }
                } else if (action === 'case' && sub && rest.length) {
                    const input = rest.join(' ');
                    const words = input.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[-_]/g, ' ').split(/\s+/).filter(Boolean);
                    if (sub === 'camel') {
                        this.addLine('  ' + words.map((w,i) => i===0 ? w.toLowerCase() : w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(''));
                    } else if (sub === 'snake') {
                        this.addLine('  ' + words.map(w => w.toLowerCase()).join('_'));
                    } else if (sub === 'kebab') {
                        this.addLine('  ' + words.map(w => w.toLowerCase()).join('-'));
                    } else if (sub === 'pascal') {
                        this.addLine('  ' + words.map(w => w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(''));
                    } else {
                        this.addLine('  styles: camel, snake, kebab, pascal');
                    }
                } else if (action === 'csv2json' && text) {
                    try {
                        const lines = text.split('\\n');
                        const headers = lines[0].split(',').map(h => h.trim());
                        const rows = lines.slice(1).map(l => {
                            const vals = l.split(',').map(v => v.trim());
                            const obj = {};
                            headers.forEach((h,i) => { obj[h] = vals[i] || ''; });
                            return obj;
                        });
                        JSON.stringify(rows, null, 2).split('\n').forEach(l => this.addLine('  ' + escapeHtml(l)));
                    } catch (e) { this.addLine('  <span class="line-error">invalid CSV</span>'); }
                } else {
                    this.addLine("  type 'help' for usage.");
                }
                this.addLine('');
            }
        }

        class TimeKitTool extends ToolBase {
            constructor() {
                super('time-kit');
                this.completions = ['unix', 'human', 'cron', 'now', 'diff', 'relative', 'zones', 'parse', 'countdown', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  time kit', cls: 'line-bright' },
                    '  <span class="dim">timestamps, cron, timezones, date math</span>',
                    null,
                    '  commands:',
                    '    now                     current unix timestamp',
                    '    unix &lt;timestamp&gt;       convert unix to human date',
                    '    human &lt;date&gt;           convert human date to unix',
                    '    diff &lt;date1&gt; &lt;date2&gt;  time difference',
                    '    relative &lt;ts&gt;          human-readable relative time',
                    '    zones                   current time in common timezones',
                    '    cron &lt;expr&gt;            parse + explain cron expression',
                    '    parse &lt;date-string&gt;   flexible date parsing',
                    '    countdown &lt;date&gt;       time remaining until date',
                    '    help, ?                 show this help',
                    '    exit, q                 return to main shell',
                    null,
                ];
            }
            humanDuration(ms) {
                const abs = Math.abs(ms);
                const s = Math.floor(abs / 1000);
                const m = Math.floor(s / 60);
                const h = Math.floor(m / 60);
                const d = Math.floor(h / 24);
                const y = Math.floor(d / 365);
                if (y > 0) return `${y} year${y>1?'s':''}, ${d%365} day${d%365!==1?'s':''}`;
                if (d > 0) return `${d} day${d>1?'s':''}, ${h%24}h`;
                if (h > 0) return `${h} hour${h>1?'s':''}, ${m%60}m`;
                if (m > 0) return `${m} minute${m>1?'s':''}`;
                return `${s} second${s!==1?'s':''}`;
            }
            explainCron(parts) {
                const [min, hr, dom, mon, dow] = parts;
                const explanations = [];
                if (min === '*' && hr === '*' && dom === '*' && mon === '*' && dow === '*') return 'every minute';
                if (min.startsWith('*/')) { const n = min.slice(2); explanations.push(`every ${n} minute${n!=='1'?'s':''}`); }
                else if (min !== '*') explanations.push(`at minute ${min}`);
                if (hr.startsWith('*/')) { const n = hr.slice(2); explanations.push(`every ${n} hour${n!=='1'?'s':''}`); }
                else if (hr !== '*') explanations.push(`at ${hr}:00`);
                if (dom !== '*') explanations.push(`on day ${dom}`);
                if (mon !== '*') { const months = ['','jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']; explanations.push(`in ${months[parseInt(mon)]||mon}`); }
                if (dow !== '*') { const days = ['sun','mon','tue','wed','thu','fri','sat']; explanations.push(`on ${days[parseInt(dow)]||dow}`); }
                return explanations.join(', ') || 'custom schedule';
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                if (action === 'now') {
                    const ts = Math.floor(Date.now() / 1000);
                    this.addCopyable('  ' + ts, String(ts));
                    this.addLine('  <span class="dim">' + new Date().toISOString() + '</span>');
                    this.addLine('');
                } else if (action === 'unix') {
                    const ts = parseInt(rest.join(' '));
                    if (!isNaN(ts)) {
                        const msTs = ts > 1e12 ? ts : ts * 1000;
                        const iso = new Date(msTs).toISOString();
                        this.addCopyable('  ' + iso, iso);
                        this.addLine('  <span class="dim">' + new Date(msTs).toLocaleString() + '</span>');
                        this.addLine('');
                    } else {
                        this.addLine('  <span class="line-error">invalid timestamp</span>');
                        this.addLine('');
                    }
                } else if (action === 'human') {
                    const date = new Date(rest.join(' '));
                    if (isNaN(date.getTime())) {
                        this.addLine('  <span class="line-error">invalid date</span>');
                    } else {
                        const ts = Math.floor(date.getTime() / 1000);
                        this.addCopyable('  ' + ts, String(ts));
                        this.addLine('  <span class="dim">' + date.toISOString() + '</span>');
                    }
                    this.addLine('');
                } else if (action === 'diff') {
                    const midIdx = rest.findIndex((r, i) => i > 0 && (r.match(/^\d{4}/) || r.match(/^\d{10}/)));
                    let d1str, d2str;
                    if (midIdx > 0) {
                        d1str = rest.slice(0, midIdx).join(' ');
                        d2str = rest.slice(midIdx).join(' ');
                    } else if (rest.length >= 2) {
                        d1str = rest[0];
                        d2str = rest.slice(1).join(' ');
                    } else {
                        this.addLine('  usage: diff &lt;date1&gt; &lt;date2&gt;');
                        this.addLine('');
                        return;
                    }
                    const d1 = new Date(d1str);
                    const d2 = new Date(d2str);
                    if (isNaN(d1.getTime()) || isNaN(d2.getTime())) {
                        this.addLine('  <span class="line-error">invalid date format</span>');
                    } else {
                        const diffMs = d2.getTime() - d1.getTime();
                        this.addLine('  ' + this.humanDuration(diffMs));
                        this.addLine(`  <span class="dim">${Math.abs(Math.round(diffMs / 86400000))} days</span>`);
                    }
                    this.addLine('');
                } else if (action === 'relative') {
                    const ts = parseInt(rest[0]);
                    if (isNaN(ts)) { this.addLine('  usage: relative &lt;unix-timestamp&gt;'); this.addLine(''); return; }
                    const msTs = ts > 1e12 ? ts : ts * 1000;
                    const diff = msTs - Date.now();
                    const duration = this.humanDuration(diff);
                    const label = diff < 0 ? duration + ' ago' : 'in ' + duration;
                    this.addLine('  ' + label);
                    this.addLine('');
                } else if (action === 'zones') {
                    this.addLine('');
                    const now = new Date();
                    const zones = [
                        ['UTC', 'UTC'], ['EST', 'America/New_York'], ['CST', 'America/Chicago'],
                        ['MST', 'America/Denver'], ['PST', 'America/Los_Angeles'],
                        ['GMT', 'Europe/London'], ['CET', 'Europe/Berlin'],
                        ['JST', 'Asia/Tokyo'], ['AEST', 'Australia/Sydney']
                    ];
                    zones.forEach(([label, tz]) => {
                        try {
                            const time = now.toLocaleString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
                            this.addLine(`  <span class="line-bright">${label.padEnd(5)}</span> ${time}`);
                        } catch (e) {
                            this.addLine(`  <span class="line-bright">${label.padEnd(5)}</span> <span class="dim">unavailable</span>`);
                        }
                    });
                    this.addLine('');
                } else if (action === 'cron') {
                    const expr = rest.join(' ');
                    const fields = ['minute', 'hour', 'day-of-month', 'month', 'day-of-week'];
                    const cparts = expr.split(/\s+/);
                    this.addLine('');
                    if (cparts.length === 5) {
                        cparts.forEach((p, i) => this.addLine(`  <span class="dim">${fields[i].padEnd(14)}</span> ${p}`));
                        this.addLine('');
                        this.addLine('  <span class="line-success">' + this.explainCron(cparts) + '</span>');
                    } else {
                        this.addLine('  <span class="line-error">expected 5 fields: min hour dom month dow</span>');
                    }
                    this.addLine('');
                } else if (action === 'parse') {
                    const input = rest.join(' ');
                    if (!input) { this.addLine('  usage: parse &lt;date-string&gt;'); this.addLine(''); return; }
                    let d = new Date(input);
                    if (isNaN(d.getTime())) {
                        const alt = [
                            input.replace(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/, '$3-$1-$2'),
                            input.replace(/(\d{1,2})-(\d{1,2})-(\d{2,4})/, '$3-$2-$1'),
                        ];
                        for (const f of alt) { const t = new Date(f); if (!isNaN(t.getTime())) { d = t; break; } }
                    }
                    if (isNaN(d.getTime())) {
                        this.addLine('  <span class="line-error">could not parse date</span>');
                        this.addLine('  <span class="dim">try: "2025-12-31", "Dec 31 2025", "12/31/2025"</span>');
                    } else {
                        const ts = Math.floor(d.getTime() / 1000);
                        const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
                        this.addLine('');
                        this.addCopyable('  iso:   ' + d.toISOString(), d.toISOString());
                        this.addCopyable('  unix:  ' + ts, String(ts));
                        this.addLine('  local: ' + d.toLocaleString());
                        this.addLine('  day:   ' + days[d.getDay()]);
                        const diff = d.getTime() - Date.now();
                        this.addLine('  rel:   ' + this.humanDuration(diff) + (diff < 0 ? ' ago' : ' from now'));
                    }
                    this.addLine('');
                } else if (action === 'countdown') {
                    const target = new Date(rest.join(' '));
                    if (isNaN(target.getTime())) { this.addLine('  <span class="line-error">invalid date</span>'); this.addLine(''); return; }
                    const diff = target.getTime() - Date.now();
                    this.addLine('');
                    if (diff <= 0) {
                        this.addLine('  <span class="line-dim">date has passed</span>');
                        this.addLine('  ' + this.humanDuration(diff) + ' ago');
                    } else {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);

        class NetworkKitTool extends ToolBase {
            constructor() {
                super('network-kit');
                this.completions = ['cidr', 'dns', 'ports', 'cookie', 'ua', 'url', 'help', '?', 'exit', 'q'];
                this.helpText = [

                    '    ports               common port reference',
                    '    cookie &lt;header&gt;    parse Set-Cookie header',
                    '    ua [string]         parse User-Agent',
                    '    url &lt;url&gt;          parse URL components',
                    '    help, ?             show this help',
                    '    exit, q             return to main shell',
                    null,
                ];
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                const arg = rest.join(' ');
                if (action === 'url') {
                    try {
                        const u = new URL(arg);
                        this.addLine('');
                        this.addLine('  protocol: ' + u.protocol);
                        this.addLine('  hostname: ' + u.hostname);
                        if (u.port) this.addLine('  port:     ' + u.port);
                        this.addLine('  pathname: ' + u.pathname);
                        if (u.search) this.addLine('  query:    ' + u.search);
                        if (u.hash) this.addLine('  hash:     ' + u.hash);
                        this.addLine('');
                    } catch (e) {
                        this.addLine('  <span class="line-error">invalid URL</span>');
                        this.addLine('');
                    }
                } else if (action === 'cidr') {
                    try {
                        const [ip, prefix] = arg.split('/');
                        const mask = parseInt(prefix);
                        const p = ip.split('.').map(Number);
                        const ipNum = (p[0]<<24 | p[1]<<16 | p[2]<<8 | p[3]) >>> 0;
                        const maskBits = (~0 << (32-mask)) >>> 0;
                        const network = (ipNum & maskBits) >>> 0;
                        const broadcast = (network | ~maskBits) >>> 0;
                        const firstHost = (network + 1) >>> 0;
                        const lastHost = (broadcast - 1) >>> 0;
                        const toIP = n => [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
                        const hostCount = Math.max(0, Math.pow(2, 32-mask)-2);
                        this.addLine('');
                        this.addLine('  network:    ' + toIP(network) + '/' + mask);
                        this.addLine('  broadcast:  ' + toIP(broadcast));
                        this.addLine('  first host: ' + toIP(firstHost));
                        this.addLine('  last host:  ' + toIP(lastHost));
                        this.addLine('  hosts:      ' + hostCount.toLocaleString());
                        this.addLine('  mask:       ' + toIP(maskBits));
                        this.addLine('  wildcard:   ' + toIP((~maskBits) >>> 0));
                        this.addLine('');
                    } catch (e) {
                        this.addLine('  <span class="line-error">usage: cidr 192.168.1.0/24</span>');
                        this.addLine('');
                    }
                } else if (action === 'dns') {
                    this.addLine('');
                    this.addLine('  <span class="line-bright">DNS record types:</span>');
                    const records = [
                        ['A','IPv4 address mapping'],['AAAA','IPv6 address mapping'],
                        ['CNAME','canonical name alias'],['MX','mail exchange server'],
                        ['TXT','text records (SPF, DKIM, verification)'],['NS','authoritative name server'],
                        ['SOA','start of authority (zone metadata)'],['PTR','reverse DNS lookup'],
                        ['SRV','service location (host + port + priority)'],['CAA','certificate authority authorization'],
                        ['DNSKEY','DNSSEC public key'],['DS','delegation signer (DNSSEC)'],
                    ];
                    records.forEach(([t, d]) => this.addLine(`    <span class="line-accent">${t.padEnd(8)}</span> ${d}`));
                    this.addLine('');
                } else if (action === 'ports') {
                    this.addLine('');
                    this.addLine('  <span class="line-bright">common ports:</span>');
                    const ports = [
                        ['20-21','FTP (data/control)'],['22','SSH'],['23','Telnet'],['25','SMTP'],
                        ['53','DNS'],['80','HTTP'],['110','POP3'],['143','IMAP'],
                        ['443','HTTPS'],['445','SMB'],['587','SMTP (submission)'],
                        ['993','IMAPS'],['995','POP3S'],['1433','MSSQL'],['1521','Oracle'],
                        ['3000','Dev servers (Node, Rails)'],['3306','MySQL'],['3389','RDP'],
                        ['5432','PostgreSQL'],['5672','RabbitMQ'],['6379','Redis'],
                        ['8080','HTTP alt / proxy'],['8443','HTTPS alt'],
                        ['9200','Elasticsearch'],['27017','MongoDB'],
                    ];
                    ports.forEach(([p, d]) => this.addLine(`    <span class="line-accent">${p.padEnd(8)}</span> ${d}`));
                    this.addLine('');
                } else if (action === 'cookie') {
                    const cparts = arg.split(';').map(p => p.trim());
                    this.addLine('');
                    cparts.forEach(p => {
                        const [key, ...val] = p.split('=');
                        this.addLine(`  ${escapeHtml(key.trim())}: ${escapeHtml(val.join('=').trim()) || '&lt;flag&gt;'}`);
                    });
                    this.addLine('');
                } else if (action === 'ua') {
                    const uaStr = arg || navigator.userAgent;
                    const browser = uaStr.match(/(Chrome|Firefox|Safari|Edge|Opera)\/[\d.]+/) || ['Unknown'];
                    const os = uaStr.match(/(Windows|Mac OS X|Linux|Android|iOS)[\s/]?[\d._]*/) || ['Unknown'];
                    this.addLine('');
                    this.addLine('  browser: ' + browser[0]);
                    this.addLine('  os:      ' + os[0]);
                    this.addLine('  raw:     ' + escapeHtml(uaStr.substring(0, 60)) + (uaStr.length > 60 ? '...' : ''));
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
        }

        class ColorKitTool extends ToolBase {
            constructor() {
                super('color-kit');
                this.completions = ['hex', 'rgb', 'hsl', 'contrast', 'palette', 'blend', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  color kit', cls: 'line-bright' },
                    '  <span class="dim">color conversion, WCAG contrast, palette, blend</span>',
                    null,
                    '  commands:',
                    '    hex &lt;color&gt;            convert to hex/rgb/hsl',
                    '    rgb &lt;color&gt;            (accepts hex, rgb(), hsl(), names)',
                    '    hsl &lt;color&gt;            show all formats',
                    '    contrast &lt;c1&gt; &lt;c2&gt;   WCAG contrast ratio + AA/AAA',
                    '    palette &lt;color&gt;        complementary, analogous, triadic',
                    '    blend &lt;c1&gt; &lt;c2&gt; [n]  gradient steps between colors',
                    '    help, ?                show this help',
                    '    exit, q                return to main shell',
                    null,
                ];
            }
            parseColor(str) {
                str = str.trim().toLowerCase();
                let m = str.match(/^#?([0-9a-f]{3,8})$/);
                if (m) {
                    let h = m[1];
                    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
                    if (h.length >= 6) return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
                }
                m = str.match(/rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/);
                if (m) return { r: +m[1], g: +m[2], b: +m[3] };
                m = str.match(/hsl\(\s*(\d+)\s*,\s*(\d+)%?\s*,\s*(\d+)%?\s*\)/);
                if (m) return this.hslToRgb(+m[1], +m[2], +m[3]);
                const names = {red:[255,0,0],green:[0,128,0],blue:[0,0,255],white:[255,255,255],black:[0,0,0],yellow:[255,255,0],cyan:[0,255,255],magenta:[255,0,255],orange:[255,165,0],purple:[128,0,128],pink:[255,192,203],gray:[128,128,128],grey:[128,128,128],navy:[0,0,128],teal:[0,128,128],coral:[255,127,80],salmon:[250,128,114],indigo:[75,0,130],lime:[0,255,0],gold:[255,215,0],silver:[192,192,192],maroon:[128,0,0],olive:[128,128,0],aqua:[0,255,255]};
                if (names[str]) { const [r,g,b] = names[str]; return {r,g,b}; }
                return null;
            }
            hslToRgb(h, s, l) {
                s /= 100; l /= 100;
                const c = (1 - Math.abs(2*l-1)) * s;
                const x = c * (1 - Math.abs((h/60)%2-1));
                const m = l - c/2;
                let r,g,b;
                if (h<60) [r,g,b]=[c,x,0]; else if (h<120) [r,g,b]=[x,c,0];
                else if (h<180) [r,g,b]=[0,c,x]; else if (h<240) [r,g,b]=[0,x,c];
                else if (h<300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
                return { r: Math.round((r+m)*255), g: Math.round((g+m)*255), b: Math.round((b+m)*255) };
            }
            rgbToHsl(r, g, b) {
                r/=255; g/=255; b/=255;
                const max=Math.max(r,g,b), min=Math.min(r,g,b);
                let h,s,l=(max+min)/2;
                if (max===min) { h=s=0; } else {
                    const d=max-min;
                    s=l>0.5?d/(2-max-min):d/(max+min);
                    if (max===r) h=((g-b)/d+(g<b?6:0))/6;
                    else if (max===g) h=((b-r)/d+2)/6;
                    else h=((r-g)/d+4)/6;
                    h=Math.round(h*360);
                }
                return { h, s: Math.round(s*100), l: Math.round(l*100) };
            }
            toHex(c) { return '#' + [c.r,c.g,c.b].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''); }
            swatch(c) { return `<span style="color:rgb(${c.r},${c.g},${c.b})">\u2588\u2588</span>`; }
            luminance(c) {
                const [rs,gs,bs] = [c.r,c.g,c.b].map(v => { v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
                return 0.2126*rs+0.7152*gs+0.0722*bs;
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                const arg = rest.join(' ');
                if (action === 'hex' || action === 'rgb' || action === 'hsl') {
                    const c = this.parseColor(arg);
                    if (!c) { this.addLine('  <span class="line-error">unrecognized color — try hex (#ff0000), rgb(255,0,0), hsl(0,100,50), or name</span>'); this.addLine(''); return; }
                    const hex = this.toHex(c);
                    const hsl = this.rgbToHsl(c.r, c.g, c.b);
                    this.addLine('');
                    this.addLine(`  ${this.swatch(c)} preview`);
                    this.addCopyable(`  hex: ${hex}`, hex);
                    const rgbStr = `rgb(${c.r}, ${c.g}, ${c.b})`;
                    this.addCopyable(`  rgb: ${rgbStr}`, rgbStr);
                    const hslStr = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
                    this.addCopyable(`  hsl: ${hslStr}`, hslStr);
                    this.addLine('');
                } else if (action === 'contrast') {
                    const parts = arg.split(/\s+/);
                    if (parts.length < 2) { this.addLine('  usage: contrast &lt;color1&gt; &lt;color2&gt;'); this.addLine(''); return; }
                    const c1 = this.parseColor(parts[0]), c2 = this.parseColor(parts[1]);
                    if (!c1 || !c2) { this.addLine('  <span class="line-error">invalid color</span>'); this.addLine(''); return; }
                    const l1 = this.luminance(c1), l2 = this.luminance(c2);
                    const ratio = (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
                    const r = Math.round(ratio*100)/100;
                    this.addLine('');
                    this.addLine(`  ${this.swatch(c1)} vs ${this.swatch(c2)}`);
                    this.addLine(`  ratio: <span class="line-bright">${r}:1</span>`);
                    this.addLine(`  AA normal:  ${r>=4.5?'<span class="line-success">PASS</span>':'<span class="line-error">FAIL</span>'} (need 4.5:1)`);
                    this.addLine(`  AA large:   ${r>=3?'<span class="line-success">PASS</span>':'<span class="line-error">FAIL</span>'} (need 3:1)`);
                    this.addLine(`  AAA normal: ${r>=7?'<span class="line-success">PASS</span>':'<span class="line-error">FAIL</span>'} (need 7:1)`);
                    this.addLine(`  AAA large:  ${r>=4.5?'<span class="line-success">PASS</span>':'<span class="line-error">FAIL</span>'} (need 4.5:1)`);
                    this.addLine('');
                } else if (action === 'palette') {
                    const c = this.parseColor(arg);
                    if (!c) { this.addLine('  <span class="line-error">invalid color</span>'); this.addLine(''); return; }
                    const hsl = this.rgbToHsl(c.r, c.g, c.b);
                    const comp = this.hslToRgb((hsl.h+180)%360, hsl.s, hsl.l);
                    const ana1 = this.hslToRgb((hsl.h+30)%360, hsl.s, hsl.l);
                    const ana2 = this.hslToRgb((hsl.h+330)%360, hsl.s, hsl.l);
                    const tri1 = this.hslToRgb((hsl.h+120)%360, hsl.s, hsl.l);
                    const tri2 = this.hslToRgb((hsl.h+240)%360, hsl.s, hsl.l);
                    this.addLine('');
                    this.addLine(`  ${this.swatch(c)} original        ${this.toHex(c)}`);
                    this.addCopyable(`  ${this.swatch(comp)} complementary  ${this.toHex(comp)}`, this.toHex(comp));
                    this.addCopyable(`  ${this.swatch(ana1)} analogous +30  ${this.toHex(ana1)}`, this.toHex(ana1));
                    this.addCopyable(`  ${this.swatch(ana2)} analogous -30  ${this.toHex(ana2)}`, this.toHex(ana2));
                    this.addCopyable(`  ${this.swatch(tri1)} triadic +120   ${this.toHex(tri1)}`, this.toHex(tri1));
                    this.addCopyable(`  ${this.swatch(tri2)} triadic +240   ${this.toHex(tri2)}`, this.toHex(tri2));
                    this.addLine('');
                } else if (action === 'blend') {
                    const parts = arg.split(/\s+/);
                    if (parts.length < 2) { this.addLine('  usage: blend &lt;c1&gt; &lt;c2&gt; [steps]'); this.addLine(''); return; }
                    const c1 = this.parseColor(parts[0]), c2 = this.parseColor(parts[1]);
                    if (!c1 || !c2) { this.addLine('  <span class="line-error">invalid color</span>'); this.addLine(''); return; }
                    const steps = Math.min(parseInt(parts[2]) || 7, 20);
                    this.addLine('');
                    for (let i = 0; i <= steps; i++) {
                        const t = i / steps;
                        const c = { r: Math.round(c1.r+(c2.r-c1.r)*t), g: Math.round(c1.g+(c2.g-c1.g)*t), b: Math.round(c1.b+(c2.b-c1.b)*t) };
                        this.addCopyable(`  ${this.swatch(c)} ${this.toHex(c)}  <span class="dim">${Math.round(t*100)}%</span>`, this.toHex(c));
                    }
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
        }

        class UuidKitTool extends ToolBase {
            constructor() {
                super('uuid-kit');
                this.completions = ['v4', 'v7', 'parse', 'batch', 'validate', 'nil', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  uuid kit', cls: 'line-bright' },
                    '  <span class="dim">UUID generation, parsing, validation</span>',
                    null,
                    '  commands:',
                    '    v4                  generate UUID v4 (random)',
                    '    v7                  generate UUID v7 (timestamp-sortable)',
                    '    parse &lt;uuid&gt;        show version, variant, timestamp (v7)',
                    '    batch [count]       generate multiple v4 (max 20)',
                    '    validate &lt;uuid&gt;     check if valid UUID',
                    '    nil                 the nil UUID (all zeros)',
                    '    help, ?             show this help',
                    '    exit, q             return to main shell',
                    null,
                ];
            }
            genV4() {
                const b = crypto.getRandomValues(new Uint8Array(16));
                b[6] = (b[6] & 0x0f) | 0x40;
                b[8] = (b[8] & 0x3f) | 0x80;
                const h = Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
                return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
            }
            genV7() {
                const ts = Date.now();
                const b = crypto.getRandomValues(new Uint8Array(16));
                b[0] = (ts / 0x10000000000) & 0xff;
                b[1] = (ts / 0x100000000) & 0xff;
                b[2] = (ts / 0x1000000) & 0xff;
                b[3] = (ts / 0x10000) & 0xff;
                b[4] = (ts / 0x100) & 0xff;
                b[5] = ts & 0xff;
                b[6] = (b[6] & 0x0f) | 0x70;
                b[8] = (b[8] & 0x3f) | 0x80;
                const h = Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
                return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                const arg = rest.join(' ');
                if (action === 'v4') {
                    const u = this.genV4();
                    this.addLine('');
                    this.addCopyable('  ' + u, u);
                    this.addLine('  <span class="dim">version 4 (random)</span>');
                    this.addLine('');
                } else if (action === 'v7') {
                    const u = this.genV7();
                    this.addLine('');
                    this.addCopyable('  ' + u, u);
                    this.addLine('  <span class="dim">version 7 (timestamp-sortable, ' + new Date().toISOString() + ')</span>');
                    this.addLine('');
                } else if (action === 'batch') {
                    const count = Math.min(parseInt(rest[0]) || 5, 20);
                    this.addLine('');
                    for (let i = 0; i < count; i++) {
                        const u = this.genV4();
                        this.addCopyable(`  ${String(i+1).padStart(2)}. ${u}`, u);
                    }
                    this.addLine('');
                } else if (action === 'validate') {
                    const re = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                    this.addLine('');
                    if (re.test(arg)) {
                        const ver = parseInt(arg[14], 16);
                        const vNames = {1:'time-based',2:'DCE security',3:'MD5 name-based',4:'random',5:'SHA-1 name-based',6:'reordered time',7:'Unix epoch time'};
                        this.addLine(`  <span class="line-success">valid UUID</span>`);
                        this.addLine(`  version: ${ver} (${vNames[ver] || 'unknown'})`);
                    } else {
                        this.addLine('  <span class="line-error">invalid UUID format</span>');
                        this.addLine('  <span class="dim">expected: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx</span>');
                    }
                    this.addLine('');
                } else if (action === 'parse') {
                    const re = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                    if (!re.test(arg)) { this.addLine('  <span class="line-error">invalid UUID</span>'); this.addLine(''); return; }
                    const ver = parseInt(arg[14], 16);
                    const varBits = parseInt(arg[19], 16);
                    let variant = 'unknown';
                    if ((varBits & 0x8) === 0) variant = 'NCS (reserved)';
                    else if ((varBits & 0xc) === 0x8) variant = 'RFC 9562 (standard)';
                    else if ((varBits & 0xe) === 0xc) variant = 'Microsoft (reserved)';
                    else variant = 'future (reserved)';
                    const vNames = {1:'time-based',2:'DCE security',3:'MD5 name-based',4:'random',5:'SHA-1 name-based',6:'reordered time',7:'Unix epoch time'};
                    this.addLine('');
                    this.addLine(`  version:  <span class="line-bright">${ver}</span> (${vNames[ver] || 'unknown'})`);
                    this.addLine(`  variant:  ${variant}`);
                    if (ver === 7) {
                        const hex = arg.replace(/-/g, '').slice(0, 12);
                        const ts = parseInt(hex, 16);
                        const d = new Date(ts);
                        this.addLine(`  created:  ${d.toISOString()}`);
                        this.addLine(`  <span class="dim">unix ms: ${ts}</span>`);
                    } else if (ver === 1) {
                        this.addLine('  <span class="dim">v1 timestamps use Gregorian epoch (Oct 1582)</span>');
                    }
                    this.addLine('');
                } else if (action === 'nil') {
                    const nil = '00000000-0000-0000-0000-000000000000';
                    this.addLine('');
                    this.addCopyable('  ' + nil, nil);
                    this.addLine('  <span class="dim">nil UUID (all zeros)</span>');
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
        }
