<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'none'; img-src 'self'; frame-ancestors 'none';">
    <title>penumbraforge</title>
    <meta name="description" content="security tools. ai applications. software that works.">
    <meta name="author" content="Penumbra Forge">
    <meta name="copyright" content="Copyright 2026 Penumbra Forge. All rights reserved.">
    <meta property="og:title" content="penumbraforge">
    <meta property="og:description" content="security tools. ai applications. software that works.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://penumbraforge.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { touch-action: manipulation; }

        :root {
            --bg: #07070b;
            --surface: #0b0b11;
            --border: #1a1a24;
            --text: #8a8a98;
            --text-bright: #aaaabc;
            --text-dim: #3a3a48;
            --prompt: #6b8f6b;
            --accent: #687a8e;
            --accent-hover: #8a9aae;
            --success: #6b8f6b;
            --error: #8a5555;
            --cursor: #8a8a98;
        }

        html[data-theme="amber"] {
            --bg: #0a0800; --surface: #110f08; --border: #242010;
            --text: #a89870; --text-bright: #c8b890; --text-dim: #48401c;
            --prompt: #a89060; --accent: #c8a850; --accent-hover: #d8c070;
            --success: #90a830; --error: #a85030; --cursor: #a89870;
        }

        html[data-theme="green"] {
            --bg: #000a00; --surface: #001100; --border: #003000;
            --text: #30a830; --text-bright: #50d850; --text-dim: #0a4810;
            --prompt: #20c820; --accent: #40b840; --accent-hover: #60d860;
            --success: #40c840; --error: #a83030; --cursor: #30a830;
        }

        html[data-theme="blue"] {
            --bg: #000008; --surface: #000810; --border: #001830;
            --text: #5878a8; --text-bright: #7898d0; --text-dim: #1c3058;
            --prompt: #4878b8; --accent: #5088d0; --accent-hover: #70a8f0;
            --success: #40a870; --error: #a85050; --cursor: #5878a8;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 1px,
                rgba(0, 0, 0, 0.02) 1px,
                rgba(0, 0, 0, 0.02) 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        .terminal {
            width: 100%;
            max-width: 760px;
            height: 88vh;
            max-height: 640px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(80, 80, 120, 0.03),
                         0 0 2px rgba(80, 80, 120, 0.06);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .terminal-title {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }

        .terminal-spacer {
            width: 38px;
        }

        .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px;
            cursor: text;
        }

        .terminal-body::-webkit-scrollbar { width: 3px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background: var(--border); }

        .line {
            white-space: pre;
            min-height: 1.5em;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .line::-webkit-scrollbar { display: none; }

        .line-bright { color: var(--text-bright); }
        .line-dim { color: var(--text-dim); }
        .line-success { color: var(--success); }
        .line-accent { color: var(--accent); }
        .line-error { color: var(--error); }

        .prompt-text { color: var(--prompt); }
        .cmd-text { color: var(--text-bright); }

        .tool-name {
            color: var(--accent);
            cursor: pointer;
            transition: color 0.15s;
        }

        .tool-name:hover {
            color: var(--accent-hover);
        }

        .dots { color: var(--text-dim); }
        .dim { color: var(--text-dim); }
        .bright { color: var(--text-bright); }
        .green { color: var(--success); }

        .link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.15s;
        }

        .link:hover { color: var(--accent-hover); }

        .link-output {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.15s, text-decoration 0.15s;
        }

        .link-output:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .input-line {
            display: flex;
            align-items: center;
            padding: 8px 18px 16px;
            flex-shrink: 0;
        }

        .input-prompt {
            color: var(--prompt);
            margin-right: 8px;
            white-space: nowrap;
            user-select: none;
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-bright);
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            caret-color: var(--cursor);
            padding: 0;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .input-field::placeholder {
            color: var(--text-dim);
        }

        @media (max-width: 640px) {
            body { padding: 0; font-size: 11px; }
            .terminal {
                border: none;
                height: 100vh;
                height: 100dvh;
                max-height: none;
                max-width: none;
            }
            .terminal-body { padding: 12px 12px 8px; }
            .input-line { padding: 8px 12px 12px; }
            .input-field { font-size: 16px; }
        }

        @media (max-height: 500px) {
            .terminal { max-height: none; height: 100vh; }
        }

        /* Tool Terminal Styles */
        .tool-terminal {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
        }

        .tool-terminal.active {
            display: flex;
        }

        .tool-terminal .terminal-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .tool-terminal .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px;
            cursor: text;
        }

        .tool-terminal .input-line {
            display: flex;
            align-items: center;
            padding: 8px 18px 16px;
            flex-shrink: 0;
        }

        .tool-terminal .input-prompt {
            color: var(--prompt);
            margin-right: 8px;
            white-space: nowrap;
            user-select: none;
        }

        .tool-terminal .input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-bright);
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            caret-color: var(--cursor);
            padding: 0;
        }
        /* Copy-to-clipboard system */
        .copyable {
            display: flex;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }

        .copyable:hover {
            background: rgba(255,255,255,0.015);
        }

        .copyable-text {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .copyable-text::-webkit-scrollbar { display: none; }

        .copy-float {
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 9px;
            padding: 2px 6px;
            margin-left: 8px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s, border-color 0.15s;
            z-index: 10;
            letter-spacing: 0.04em;
        }

        .copyable:hover .copy-float,
        .copy-float.always-show {
            opacity: 1;
        }

        .copy-float:hover {
            color: var(--text);
            border-color: var(--text-dim);
        }

        .copy-float.copied {
            color: var(--success);
            border-color: var(--success);
            opacity: 1;
        }

        @media (max-width: 640px) {
            .copy-float { opacity: 1; }
        }

        @media (pointer: coarse) {
            .copy-float { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <div class="terminal-dots">
                <span></span><span></span><span></span>
            </div>
            <div class="terminal-title">penumbraforge</div>
            <div class="terminal-spacer"></div>
        </div>
        <div class="terminal-body" id="output"></div>
        <div class="input-line">
            <span class="input-prompt" id="mainPrompt">visitor@forge:~$</span>
            <input type="text" class="input-field" id="cmdInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="">
        </div>
    </div>

    <!-- Tool Terminal (shown when tool is launched) -->
    <div class="tool-terminal" id="toolTerminal">
        <div class="terminal-header">
            <div class="terminal-dots">
                <span></span><span></span><span></span>
            </div>
            <div class="terminal-title" id="toolTitle">tool</div>
            <div class="terminal-spacer"></div>
        </div>
        <div class="terminal-body" id="toolOutput"></div>
        <div class="input-line">
            <span class="input-prompt" id="toolPrompt">forge[tool]$</span>
            <input type="text" class="input-field" id="toolInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="">
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('cmdInput');
        const body = document.querySelector('.terminal-body');
        let history = [];
        let historyIndex = -1;
        let currentPath = '~';
        const mainPrompt = document.getElementById('mainPrompt');

        const toolUrls = {
            // Tools with dedicated pages at /tools/{slug}/
            'password-gen':    '/tools/password-generator/',
            'hash-gen':        '/tools/hash-generator/',
            'entropy-calc':    '#',
            'curl-converter':  '/tools/curl-converter/',
            'dockerfile-opt':  '/tools/dockerfile-optimizer/',
            'git-branches':    '/tools/git-branch-visualizer/',
            'regex-gen':       '/tools/regex-tester/',
            'jwt-decoder':     '/tools/jwt-decoder/',
            'encoding-suite':  '/tools/base64-encoder/',

            // Cloud-hosted tools (external service)
            'secret-lock':     'https://tools.penumbraforge.com/lock',
            'one-time-secret': 'https://tools.penumbraforge.com/secret',
            'view-lock':       'https://tools.penumbraforge.com/view-lock',

            // Legacy entries
            'hash-cmp':        '/tools#hashcmp',
            'aes':             '/tools#aes',
            'cors-analyzer':   '/tools#cors',
            'dungeon':         '/game/',
            'snake':           '/snake/',
            'gate':            '/gate/',
            'librarian':       '/librarian/',

            // All other tools now use ToolBase system and run from terminal
        };

        // Aliases removed — toolRegistry handles all name mappings directly
        const toolAliases = {
            'game': 'dungeon',
            'roguelike': 'dungeon',
            'play': 'dungeon',
            'snek': 'snake',
            'multiplayer': 'snake',
            'security': 'gate',
            'scanner': 'gate',
            'mcp': 'librarian',
            'skills': 'librarian',
        };

        function addLine(text, cls) {
            const div = document.createElement('div');
            div.className = 'line' + (cls ? ' ' + cls : '');
            div.innerHTML = text || '&nbsp;';
            output.appendChild(div);
            scrollBottom();
        }

        function addLines(lines) {
            lines.forEach(l => {
                if (typeof l === 'string') addLine(l);
                else if (l === null) addLine('');
                else addLine(l.text, l.cls);
            });
        }

        function addPromptLine(cmd) {
            if (currentActiveTool) {
                addLine(`<span class="prompt-text">forge[${currentActiveTool.name}]$</span> <span class="cmd-text">${escapeHtml(cmd)}</span>`);
            } else {
                addLine(`<span class="prompt-text">visitor@forge:${currentPath}$</span> <span class="cmd-text">${escapeHtml(cmd)}</span>`);
            }
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function scrollBottom() {
            requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
        }

        function toolSpan(name) {
            return `<span class="tool-name" data-tool="${name}">${name}</span>`;
        }

        function pad(str, len) {
            return str + ' '.repeat(Math.max(0, len - str.length));
        }

        const commands = {
            help() {
                addLines([
                    null,
                    { text: '  commands:', cls: 'line-bright' },
                    null,
                    '    help            show this message',
                    '    tools           browse available tools',
                    '    about           about penumbra forge',
                    '    contact         get in touch',
                    '    github          view source on github',
                    '    clear           clear the terminal',
                    '    open &lt;tool&gt;     open a specific tool',
                    '    theme [name]    switch color theme',
                    '    history [n]     show command history',
                    '    neofetch        system information',
                    null,
                    '  <span class="dim">!! repeats last command, !n repeats nth command</span>',
                    '  <span class="dim">you can also type a tool name directly to open it.</span>',
                    null,
                ]);
            },

            tools() {
                addLines([
                    null,
                    { text: '  ~/tools/', cls: 'line-bright' },
                    null,
                    '  <span class="dim">security</span>',
                    `    ${toolSpan('password-kit')}           <span class="dots">..</span> generation, strength, entropy`,
                    `    ${toolSpan('hash-kit')}               <span class="dots">..</span> sha-256, sha-512, identification`,
                    `    ${toolSpan('crypto-kit')}             <span class="dots">..</span> hmac, aes-256-gcm, key generation`,
                    `    ${toolSpan('token-kit')}              <span class="dots">..</span> jwt decode/encode, token analysis`,
                    `    ${toolSpan('cert-kit')}               <span class="dots">..</span> ssl/tls certificate parsing`,
                    null,
                    '  <span class="dim">developer</span>',
                    `    ${toolSpan('shell-explain-kit')}      <span class="dots">..</span> bash learning & reference`,
                    `    ${toolSpan('regex-educational-kit')}  <span class="dots">..</span> regex learning & patterns`,
                    `    ${toolSpan('api-kit')}                <span class="dots">..</span> cors, http status, key scanning`,
                    `    ${toolSpan('diff-kit')}               <span class="dots">..</span> text & json comparison`,
                    `    ${toolSpan('data-format-kit')}        <span class="dots">..</span> json, csv, yaml, case conversion`,
                    null,
                    '  <span class="dim">encoding & conversion</span>',
                    `    ${toolSpan('encoding-kit')}           <span class="dots">..</span> base64, hex, url, html, unicode`,
                    null,
                    '  <span class="dim">utilities</span>',
                    `    ${toolSpan('time-kit')}               <span class="dots">..</span> timestamps, cron, countdown, parsing`,
                    `    ${toolSpan('network-kit')}            <span class="dots">..</span> cidr, subnet, cookies, user-agent`,
                    `    ${toolSpan('random-kit')}             <span class="dots">..</span> random numbers, hex strings, shuffle`,
                    `    ${toolSpan('color-kit')}              <span class="dots">..</span> hex/rgb/hsl, WCAG contrast, palette`,
                    `    ${toolSpan('uuid-kit')}               <span class="dots">..</span> v4, v7, parse, validate, batch`,
                    null,
                    '  <span class="dim">products</span>',
                    `    ${toolSpan('gate')}                   <span class="dots">..</span> pre-commit secret defense`,
                    `    ${toolSpan('librarian')}              <span class="dots">..</span> intelligent MCP skills server`,
                    null,
                    '  <span class="dim">games</span>',
                    `    ${toolSpan('dungeon')}                <span class="dots">..</span> ascii roguelike`,
                    `    ${toolSpan('snake')}                  <span class="dots">..</span> multiplayer snake`,
                    null,
                    '  <span class="dim">aliases: "password" → password-kit, "jwt" → token-kit, "color" → color-kit, etc</span>',
                    '  <span class="dim">type a tool name or click to open • type "q" inside tools to return here</span>',
                    null,
                ]);
            },

            ls() { commands.tools(); },

            about() {
                addLines([
                    null,
                    { text: '  penumbra forge', cls: 'line-bright' },
                    '  independent software studio — arizona',
                    null,
                    '  we build security tools, ai applications,',
                    '  and automation systems.',
                    null,
                    '  <span class="dim">focus</span>        <span class="bright">security · ai · automation</span>',
                    '  <span class="dim">philosophy</span>   <span class="bright">privacy by default. open by design.</span>',
                    '  <span class="dim">stack</span>        <span class="bright">python · swift · cloudflare workers</span>',
                    '  <span class="dim">tools</span>        <span class="bright">all client-side. zero telemetry.</span>',
                    null,
                    '  <span class="dim">\u00a9 2026 penumbra forge. all rights reserved.</span>',
                    '  <span class="dim"><a href="/terms.html" class="link" style="color:var(--text-dim)">terms</a> · <a href="/privacy.html" class="link" style="color:var(--text-dim)">privacy</a></span>',
                    null,
                ]);
            },

            contact() {
                addLines([
                    null,
                    `  <a href="mailto:hello@penumbraforge.com" class="link">hello@penumbraforge.com</a>`,
                    null,
                    '  we take on select projects.',
                    '  no discovery calls — just tell us what you need.',
                    null,
                ]);
            },

            github() {
                addLine('');
                addLine('  opening github...');
                addLine('');
                setTimeout(() => { window.open('https://github.com/rngdz', '_blank'); }, 400);
            },

            clear() {
                output.innerHTML = '';
            },

            open(args) {
                const name = args.trim();
                if (!name) {
                    addLines([null, '  usage: open &lt;tool-name&gt;', null]);
                    return;
                }
                const resolved = toolAliases[name] || name;
                if (toolUrls[resolved]) {
                    addLine('');
                    addLine(`  opening ${resolved}...`);
                    addLine('');
                    setTimeout(() => { window.location.href = toolUrls[resolved]; }, 400);
                } else {
                    addLines([null, `  not found: ${escapeHtml(name)}`, '  <span class="dim">type \'tools\' to see what\'s available.</span>', null]);
                }
            },

            cd(args) {
                const dir = args.trim();
                if (dir === 'tools' || dir === '~/tools') {
                    addLine('');
                    addLine('  navigating to tools...');
                    addLine('');
                    setTimeout(() => { window.location.href = '/tools-page/'; }, 400);
                } else if (dir === '~' || dir === '' || dir === '/') {
                    addLines([null, '  already at ~', null]);
                } else {
                    addLines([null, `  no such directory: ${escapeHtml(dir)}`, null]);
                }
            },

            whoami() { addLines([null, '  visitor', null]); },

            pwd() { addLines([null, '  /home/visitor', null]); },

            date() {
                const d = new Date();
                const days = ['sun','mon','tue','wed','thu','fri','sat'];
                const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
                const pad2 = n => String(n).padStart(2, '0');
                const str = `  ${days[d.getDay()]} ${months[d.getMonth()]} ${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())} ${d.getFullYear()}`;
                addLines([null, str, null]);
            },

            uname() {
                addLines([null, '  penumbraforge 2.0.0 client-side-kernel x86_64', null]);
            },

            neofetch() {
                const currentTheme = document.documentElement.dataset.theme || 'penumbra';
                addLines([
                    null,
                    '  <span class="bright">        ▄▄▄</span>         <span class="dim">visitor@forge</span>',
                    '  <span class="bright">       █   █</span>        <span class="dim">─────────────</span>',
                    '  <span class="bright">      █ ▄▄▄ █</span>       <span class="dim">os:</span>     <span class="bright">penumbraforge 2.1</span>',
                    '  <span class="bright">     █ █   █ █</span>      <span class="dim">host:</span>   <span class="bright">client-side</span>',
                    '  <span class="bright">    █  █   █  █</span>     <span class="dim">kernel:</span> <span class="bright">browser</span>',
                    '  <span class="bright">     █ █   █ █</span>      <span class="dim">shell:</span>  <span class="bright">penumbraforge-sh</span>',
                    `  <span class="bright">      █ ▀▀▀ █</span>       <span class="dim">theme:</span>  <span class="bright">${currentTheme}</span>`,
                    '  <span class="bright">       █   █</span>        <span class="dim">font:</span>   <span class="bright">jetbrains mono</span>',
                    '  <span class="bright">        ▀▀▀</span>         <span class="dim">uptime:</span> <span class="bright">always</span>',
                    null,
                ]);
            },

            theme(args) {
                const themes = ['penumbra', 'amber', 'green', 'blue'];
                const current = document.documentElement.dataset.theme || 'penumbra';
                const target = args.trim().toLowerCase();
                if (!target) {
                    const idx = (themes.indexOf(current) + 1) % themes.length;
                    const next = themes[idx];
                    if (next === 'penumbra') delete document.documentElement.dataset.theme;
                    else document.documentElement.dataset.theme = next;
                    try { localStorage.setItem('pf_theme', next); } catch(e) {}
                    addLines([null, `  theme: <span class="bright">${next}</span>`, null]);
                } else if (themes.includes(target)) {
                    if (target === 'penumbra') delete document.documentElement.dataset.theme;
                    else document.documentElement.dataset.theme = target;
                    try { localStorage.setItem('pf_theme', target); } catch(e) {}
                    addLines([null, `  theme: <span class="bright">${target}</span>`, null]);
                } else {
                    addLines([null, `  available themes: ${themes.join(', ')}`, '  <span class="dim">type \'theme\' to cycle, or \'theme &lt;name&gt;\' to set</span>', null]);
                }
            },

            history(args) {
                const count = parseInt(args) || 20;
                const start = Math.max(0, history.length - count);
                addLine('');
                if (history.length === 0) {
                    addLine('  <span class="dim">no history yet</span>');
                } else {
                    for (let i = start; i < history.length; i++) {
                        addLine(`  <span class="dim">${String(i+1).padStart(4)}</span>  ${escapeHtml(history[i])}`);
                    }
                }
                addLine('');
            },
        };

        // Bash-style tab completion helper
        function findCommonPrefix(words) {
            if (words.length === 0) return '';
            if (words.length === 1) return words[0];
            
            let prefix = '';
            for (let i = 0; i < words[0].length; i++) {
                const char = words[0][i];
                if (words.every(w => w[i] === char)) {
                    prefix += char;
                } else {
                    break;
                }
            }
            return prefix;
        }

        function handleCommand(raw) {
            const trimmed = raw.trim().toLowerCase();
            if (!trimmed) return;

            // Bang expansion: !! repeats last, !n repeats nth command
            if (trimmed === '!!') {
                if (history.length > 0) {
                    addPromptLine(trimmed);
                    handleCommand(history[history.length - 1]);
                } else {
                    addPromptLine(trimmed);
                    addLines([null, '  <span class="line-error">no previous command</span>', null]);
                }
                return;
            }
            const bangMatch = trimmed.match(/^!(\d+)$/);
            if (bangMatch) {
                const idx = parseInt(bangMatch[1]) - 1;
                addPromptLine(trimmed);
                if (idx >= 0 && idx < history.length) {
                    handleCommand(history[idx]);
                } else {
                    addLines([null, `  <span class="line-error">history: ${escapeHtml(bangMatch[1])}: event not found</span>`, null]);
                }
                return;
            }

            history.push(trimmed);
            historyIndex = history.length;

            addPromptLine(trimmed);

            const [cmd, ...rest] = trimmed.split(/\s+/);
            const args = rest.join(' ');

            if (commands[cmd]) {
                commands[cmd](args);
            } else {
                const resolved = toolAliases[cmd] || cmd;
                if (toolRegistry[resolved] || toolUrls[resolved]) {
                    addLine('');
                    launchTool(resolved);
                } else {
                    addLines([
                        null,
                        `  command not found: ${escapeHtml(cmd)}`,
                        '  <span class="dim">type \'help\' for available commands.</span>',
                        null,
                    ]);
                }
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (currentActiveTool) {
                    const cmd = input.value.trim();
                    input.value = '';
                    if (!cmd) return;
                    history.push(cmd);
                    historyIndex = history.length;
                    addPromptLine(cmd);
                    currentActiveTool.handleInput(cmd);
                } else {
                    handleCommand(input.value);
                    input.value = '';
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = history[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    input.value = history[historyIndex];
                } else {
                    historyIndex = history.length;
                    input.value = '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const val = input.value.trim().toLowerCase();

                // Context-aware completion: tool commands or main commands
                let allCmds;
                if (currentActiveTool) {
                    allCmds = currentActiveTool.completions || ['help', 'exit', 'q'];
                } else {
                    allCmds = [...Object.keys(commands), ...Object.keys(toolUrls), ...Object.keys(toolAliases), ...Object.keys(toolRegistry)];
                }
                const unique = [...new Set(allCmds)];
                const matches = val ? unique.filter(c => c.startsWith(val)).sort() : unique.sort();
                
                if (matches.length === 0) {
                    return; // No matches
                } else if (matches.length === 1) {
                    // Exactly one match: fill it completely + trailing space
                    input.value = matches[0] + ' ';
                } else {
                    // Multiple matches: fill common prefix, show all
                    const commonPrefix = findCommonPrefix(matches);
                    
                    if (commonPrefix.length > val.length) {
                        // We found a common prefix longer than what's typed
                        input.value = commonPrefix;
                    } else {
                        // No further common prefix, show all matches
                        addPromptLine(val);
                        // Format matches in columns for readability
                        const formatted = matches.map(m => m.padEnd(20)).reduce((acc, m, i) => {
                            if (i % 3 === 0) acc.push('');
                            acc[acc.length - 1] += m;
                            return acc;
                        }, []);
                        addLine('  ' + formatted.join('\n  '));
                        addLine('');
                    }
                }
            } else if (e.key === 'Escape' && currentActiveTool) {
                e.preventDefault();
                addPromptLine('exit');
                currentActiveTool.hide();
            } else if (e.key === 'c' && e.ctrlKey && currentActiveTool) {
                e.preventDefault();
                addLine('^C');
                input.value = '';
            } else if (e.key === 'l' && e.ctrlKey) {
                e.preventDefault();
                output.innerHTML = '';
            }
        });

        // Tool Terminal System
        const toolTerminal = document.getElementById('toolTerminal');
        const toolOutput = document.getElementById('toolOutput');
        const toolInput = document.getElementById('toolInput');
        const toolTitle = document.getElementById('toolTitle');
        const toolPrompt = document.getElementById('toolPrompt');
        let currentActiveTool = null;

        // ════════════════════════════════════════════════════════════════════════════════
        // 15 UNIFIED COMPREHENSIVE KITS - CONSOLIDATED TOOLS
        // ════════════════════════════════════════════════════════════════════════════════

        class ToolBase {
            constructor(name) {
                this.name = name;
                this.helpText = null;
                this.completions = ['help', '?', 'exit', 'q'];
            }

            show() {
                currentActiveTool = this;
                mainPrompt.textContent = `forge[${this.name}]$`;

                if (this.helpText) {
                    this.displayHelp();
                }
                input.focus();
            }

            hide() {
                currentActiveTool = null;
                mainPrompt.textContent = `visitor@forge:${currentPath}$`;
                addLine('');
                input.focus();
            }

            addLine(text, cls) {
                const div = document.createElement('div');
                div.className = 'line' + (cls ? ' ' + cls : '');
                div.innerHTML = text || '&nbsp;';
                output.appendChild(div);
                scrollBottom();
            }

            addLines(lines) {
                lines.forEach(l => {
                    if (typeof l === 'string') this.addLine(l);
                    else if (l === null) this.addLine('');
                    else this.addLine(l.text, l.cls);
                });
            }

            displayHelp() {
                this.addLines([null, ...this.helpText, null]);
            }

            addCopyable(text, plainText) {
                const div = document.createElement('div');
                div.className = 'line copyable';
                const textSpan = document.createElement('span');
                textSpan.className = 'copyable-text';
                // text param is pre-sanitized by each tool (only contains our own spans)
                textSpan.innerHTML = text || '\u00a0';
                div.appendChild(textSpan);
                const btn = document.createElement('span');
                btn.className = 'copy-float';
                btn.textContent = 'copy';
                const copyText = plainText || textSpan.textContent.trim();
                const doCopy = () => {
                    if (!navigator.clipboard) return;
                    navigator.clipboard.writeText(copyText).then(() => {
                        btn.textContent = 'copied';
                        btn.classList.add('copied');
                        setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
                    }).catch(() => {});
                };
                btn.addEventListener('click', (e) => { e.stopPropagation(); doCopy(); });
                div.addEventListener('click', doCopy);
                div.appendChild(btn);
                output.appendChild(div);
                scrollBottom();
            }

            addSection(title) {
                this.addLine('');
                this.addLine(`  <span class="line-bright">${title}</span>`);
            }

            addResult(label, value) {
                this.addLine('');
                this.addLine(`  <span class="dim">${label}</span>`);
                this.addCopyable('  ' + escapeHtml(String(value)), String(value));
                this.addLine('');
            }

            handleInput(cmd) {
                this.addLine(`  unknown command: ${escapeHtml(cmd)}`);
            }
        }

        class DiffSuiteTool extends ToolBase {
            constructor() {
                super('diff-kit');
                this.completions = ['text', 'json', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  diff suite', cls: 'line-bright' },
                    '  <span class="dim">text & JSON comparison</span>',
                    null,
                    '  commands:',
                    '    text-diff          compare two text blocks',
                    '    json-diff &lt;a&gt; &lt;b&gt;  compare two JSON objects',
                    '    help, ?            show this help',
                    '    exit, q            return to main shell',
                    null,
                ];
                this.textA = null;
                this.textB = null;
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                const text = rest.join(' ');
                if (action === 'text-diff') {
                    if (!this.textA) {
                        this.textA = text;
                        this.addLine('  <span class="line-success">text A set</span>');
                    } else {
                        const diff = this.computeTextDiff(this.textA, text);
                        diff.forEach(d => this.addLine(d));
                        this.textA = null;
                    }
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
            computeTextDiff(a, b) {
                const lines = [];
                const aLines = a.split('\n');
                const bLines = b.split('\n');
                const maxLen = Math.max(aLines.length, bLines.length);
                for (let i = 0; i < maxLen; i++) {
                    const aLine = aLines[i] || '';
                    const bLine = bLines[i] || '';
                    if (aLine === bLine) {
                        if (aLine) lines.push(`  = ${escapeHtml(aLine)}`);
                    } else {
                        if (aLine) lines.push(`  <span class="line-error">- ${escapeHtml(aLine)}</span>`);
                        if (bLine) lines.push(`  <span class="line-success">+ ${escapeHtml(bLine)}</span>`);
                    }
                }
                return lines;
            }
        }

        class HashSuiteTool extends ToolBase {
            constructor() {
                super('hash-kit');
                this.completions = ['sha1', 'sha256', 'sha512', 'identify', 'compare', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  hash suite', cls: 'line-bright' },
                    '  <span class="dim">hash generation, identification & comparison</span>',
                    null,
                    '  commands:',
                    '    sha1 &lt;text&gt;          compute sha-1 hash',
                    '    sha256 &lt;text&gt;        compute sha-256 hash',
                    '    sha512 &lt;text&gt;        compute sha-512 hash',
                    '    identify &lt;hash&gt;     identify hash type by length',
                    '    compare &lt;h1&gt; &lt;h2&gt;  visual character-by-character diff',
                    '    help, ?             show this help',
                    '    exit, q             return to main shell',
                    null,
                ];
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                const text = rest.join(' ');
                if (action === 'sha1') {
                    this.hashText(text, 'SHA-1').then(h => {
                        this.addLine('');
                        this.addLine(`  <span class="dim">SHA-1 (${h.length} chars)</span>`);
                        this.addCopyable('  ' + h, h);
                        this.addLine('');
                    });
                } else if (action === 'sha256') {
                    this.hashText(text, 'SHA-256').then(h => {
                        this.addLine('');
                        this.addLine(`  <span class="dim">SHA-256 (${h.length} chars)</span>`);
                        this.addCopyable('  ' + h, h);
                        this.addLine('');
                    });
                } else if (action === 'sha512') {
                    this.hashText(text, 'SHA-512').then(h => {
                        this.addLine('');
                        this.addLine(`  <span class="dim">SHA-512 (${h.length} chars)</span>`);
                        this.addCopyable('  ' + h, h);
                        this.addLine('');
                    });
                } else if (action === 'identify') {
                    const hash = text.toLowerCase();
                    const types = [];
                    if (/^[a-f0-9]{32}$/i.test(hash)) types.push('MD5');
                    if (/^[a-f0-9]{40}$/i.test(hash)) types.push('SHA-1');
                    if (/^[a-f0-9]{56}$/i.test(hash)) types.push('SHA-224');
                    if (/^[a-f0-9]{64}$/i.test(hash)) types.push('SHA-256');
                    if (/^[a-f0-9]{96}$/i.test(hash)) types.push('SHA-384');
                    if (/^[a-f0-9]{128}$/i.test(hash)) types.push('SHA-512');
                    if (/^\$2[aby]\$/.test(text)) types.push('bcrypt');
                    this.addLine('');
                    if (types.length === 0) {
                        this.addLine('  <span class="line-error">unrecognized hash format</span>');
                    } else {
                        this.addLine(`  <span class="line-bright">length:</span> ${text.length} chars`);
                        this.addLine(`  <span class="line-bright">type:</span>   ${types.join(' or ')}`);
                    }
                    this.addLine('');
                } else if (action === 'compare') {
                    const hashes = rest;
                    if (hashes.length < 2) {
                        this.addLine('  usage: compare &lt;hash1&gt; &lt;hash2&gt;');
                        this.addLine('');
                        return;
                    }
                    const h1 = hashes[0].toLowerCase();
                    const h2 = hashes[1].toLowerCase();
                    this.addLine('');
                    if (h1 === h2) {
                        this.addLine('  <span class="line-success">match — hashes are identical</span>');
                    } else {
                        let diff = '';
                        const maxLen = Math.max(h1.length, h2.length);
                        for (let i = 0; i < maxLen; i++) {
                            const c1 = h1[i] || ' ';
                            const c2 = h2[i] || ' ';
                            diff += c1 === c2 ? '<span class="dim">' + escapeHtml(c1) + '</span>' : '<span class="line-error">' + escapeHtml(c1) + '</span>';
                        }
                        this.addLine('  h1: ' + diff);
                        let diff2 = '';
                        for (let i = 0; i < maxLen; i++) {
                            const c1 = h1[i] || ' ';
                            const c2 = h2[i] || ' ';
                            diff2 += c1 === c2 ? '<span class="dim">' + escapeHtml(c2) + '</span>' : '<span class="line-error">' + escapeHtml(c2) + '</span>';
                        }
                        this.addLine('  h2: ' + diff2);
                        let diffCount = 0;
                        for (let i = 0; i < maxLen; i++) if ((h1[i]||'') !== (h2[i]||'')) diffCount++;
                        this.addLine(`  <span class="line-error">${diffCount} characters differ</span>`);
                    }
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
            async hashText(text, algo) {
                const encoder = new TextEncoder();
                const data = encoder.encode(text);
                const hashBuffer = await crypto.subtle.digest(algo, data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }
        }

            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }

                const [action, ...rest] = cmd.split(/\s+/);

                if (action === 'character-classes') {

                    Object.entries(this.topics.character_classes).forEach(([pattern, desc]) => {

                    });
                    this.addLine('');
                } else if (action === 'test') {
                    const parts = arg.split(/\s+/);
                    const pattern = parts[0];
                    const text = parts.slice(1).join(' ');

                        const regex = new RegExp(pattern, 'g');

                    this.addLine('');
                    const tokens = arg.split('');
                    let i = 0;
                    while (i < tokens.length) {
                        const c = tokens[i];
                        if (c === '\\' && i+1 < tokens.length) {
                            const next = tokens[i+1];
                            const specials = { 'd':'digit [0-9]', 'D':'non-digit', 'w':'word char [a-zA-Z0-9_]', 'W':'non-word char', 's':'whitespace', 'S':'non-whitespace', 'b':'word boundary', 'B':'non-word boundary', 'n':'newline', 't':'tab' };
                            this.addLine(`  <span class="line-accent">\\${next}</span> — ${specials[next] || 'escaped ' + next}`);
                            i += 2;
                        } else if (c === '.') { this.addLine('  <span class="line-accent">.</span>  — any character except newline'); i++;
                        } else if (c === '^') { this.addLine('  <span class="line-accent">^</span>  — start of string/line'); i++;
                        } else if (c === '$') { this.addLine('  <span class="line-accent">$</span>  — end of string/line'); i++;
                        } else if (c === '*') { this.addLine('  <span class="line-accent">*</span>  — zero or more (greedy)'); i++;
                        } else if (c === '+') { this.addLine('  <span class="line-accent">+</span>  — one or more (greedy)'); i++;
                        } else if (c === '?') { this.addLine('  <span class="line-accent">?</span>  — zero or one / non-greedy modifier'); i++;
                        } else if (c === '|') { this.addLine('  <span class="line-accent">|</span>  — alternation (or)'); i++;
                        } else if (c === '(') { this.addLine('  <span class="line-accent">(</span>  — start capturing group'); i++;

                        } else if (c === '[') {
                            let cls = '[';
                            i++;
                            while (i < tokens.length && tokens[i] !== ']') { cls += tokens[i]; i++; }
                            if (i < tokens.length) { cls += ']'; i++; }
                            this.addLine(`  <span class="line-accent">${escapeHtml(cls)}</span> — character class`);
                        } else if (c === '{') {
                            let quant = '{';
                            i++;
                            while (i < tokens.length && tokens[i] !== '}') { quant += tokens[i]; i++; }
                            if (i < tokens.length) { quant += '}'; i++; }
                            this.addLine(`  <span class="line-accent">${escapeHtml(quant)}</span> — quantifier`);
                        } else {
                            this.addLine(`  <span class="line-accent">${escapeHtml(c)}</span>  — literal "${escapeHtml(c)}"`);

        class TokenSuiteTool extends ToolBase {
            constructor() {
                super('token-kit');
                this.completions = ['decode', 'analyze', 'encode', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  token suite', cls: 'line-bright' },
                    '  <span class="dim">JWT decode, analyze, encode</span>',
                    null,
                    '  commands:',
                    '    decode &lt;jwt&gt;       decode header + payload',
                    '    analyze &lt;jwt&gt;      decode + check exp/iat/nbf, warn expired',
                    '    encode &lt;json&gt;      create HS256 JWT from JSON payload',
                    '    help, ?            show this help',
                    '    exit, q            return to main shell',
                    null,
                ];
            }
            b64urlDecode(str) {
                const padded = str.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(atob(padded));
            }
            b64urlEncode(obj) {
                return btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
            formatTimestamp(ts) {
                if (!ts) return null;
                const d = new Date(ts * 1000);
                const now = Date.now();
                const diff = ts * 1000 - now;
                const absDiff = Math.abs(diff);
                let relative;
                if (absDiff < 60000) relative = 'just now';
                else if (absDiff < 3600000) relative = Math.round(absDiff / 60000) + 'm';
                else if (absDiff < 86400000) relative = Math.round(absDiff / 3600000) + 'h';
                else relative = Math.round(absDiff / 86400000) + 'd';
                relative = diff < 0 ? relative + ' ago' : 'in ' + relative;
                return d.toISOString() + ' (' + relative + ')';
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                const tokenStr = rest.join(' ').replace(/\s/g, '');
                if (action === 'decode' || action === 'analyze') {
                    try {
                        const parts = tokenStr.split('.');
                        if (parts.length !== 3) throw new Error('not 3 parts');
                        const header = this.b64urlDecode(parts[0]);
                        const payload = this.b64urlDecode(parts[1]);
                        this.addLine('');
                        this.addLine('  <span class="line-success">header:</span>');
                        JSON.stringify(header, null, 2).split('\n').forEach(l => this.addLine('    ' + escapeHtml(l)));
                        this.addLine('');
                        this.addLine('  <span class="line-success">payload:</span>');
                        JSON.stringify(payload, null, 2).split('\n').forEach(l => this.addLine('    ' + escapeHtml(l)));
                        if (action === 'analyze') {
                            this.addLine('');
                            if (payload.iat) this.addLine('  <span class="dim">issued:</span>  ' + this.formatTimestamp(payload.iat));
                            if (payload.nbf) this.addLine('  <span class="dim">not before:</span> ' + this.formatTimestamp(payload.nbf));
                            if (payload.exp) {
                                const expired = payload.exp * 1000 < Date.now();
                                const cls = expired ? 'line-error' : 'line-success';
                                this.addLine(`  <span class="dim">expires:</span> <span class="${cls}">${this.formatTimestamp(payload.exp)}${expired ? ' EXPIRED' : ''}</span>`);
                            }
                            if (payload.sub) this.addLine('  <span class="dim">subject:</span> ' + escapeHtml(String(payload.sub)));
                            if (payload.iss) this.addLine('  <span class="dim">issuer:</span>  ' + escapeHtml(String(payload.iss)));
                        }
                        this.addLine('');
                    } catch (e) {
                        this.addLine('  <span class="line-error">invalid JWT format</span>');
                        this.addLine('');
                    }
                } else if (action === 'encode') {
                    try {
                        const payloadStr = rest.join(' ');
                        const payload = JSON.parse(payloadStr);
                        const header = { alg: 'HS256', typ: 'JWT' };
                        const headerB64 = this.b64urlEncode(header);
                        const payloadB64 = this.b64urlEncode(payload);
                        const unsignedToken = headerB64 + '.' + payloadB64;
                        const enc = new TextEncoder();
                        const keyData = crypto.getRandomValues(new Uint8Array(32));
                        crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
                            .then(key => crypto.subtle.sign('HMAC', key, enc.encode(unsignedToken)))
                            .then(sig => {
                                const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                                const jwt = unsignedToken + '.' + sigB64;
                                this.addLine('');
                                this.addLine('  <span class="line-bright">JWT (HS256):</span>');
                                this.addCopyable('  ' + jwt, jwt);
                                this.addLine('  <span class="dim">signing key: random (not stored)</span>');
                                this.addLine('');
                            });
                    } catch (e) {
                        this.addLine('  <span class="line-error">invalid JSON payload</span>');
                        this.addLine('  usage: encode {"sub":"user","name":"test"}');
                        this.addLine('');
                    }
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
        }

        class EncodingKitTool extends ToolBase {
            constructor() {
                super('encoding-kit');
                this.completions = ['base64', 'hex', 'url', 'html', 'unicode', 'rot13', 'binary', 'all', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  encoding kit', cls: 'line-bright' },
                    '  <span class="dim">base64, hex, URL, HTML, Unicode, ROT13, binary</span>',
                    null,
                    '  commands:',
                    '    base64 encode/decode &lt;text&gt;',
                    '    hex encode/decode &lt;text&gt;',
                    '    url encode/decode &lt;text&gt;',
                    '    html encode/decode &lt;text&gt;',
                    '    unicode encode/decode &lt;text&gt;',
                    '    rot13 &lt;text&gt;               ROT13 cipher',
                    '    binary encode/decode &lt;text&gt;',
                    '    all &lt;text&gt;                 show all encodings at once',
                    '    help, ?                    show this help',
                    '    exit, q                    return to main shell',
                    null,
                ];
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const parts = cmd.split(/\s+/);
                const [type, action, ...rest] = parts;
                const text = rest.join(' ');
                this.addLine('');
                if (type === 'base64' && action === 'encode') {
                    const r = btoa(text);
                    this.addCopyable('  ' + r, r);
                } else if (type === 'base64' && action === 'decode') {
                    try { const r = atob(text); this.addCopyable('  ' + escapeHtml(r), r); }
                    catch (e) { this.addLine('  <span class="line-error">invalid base64</span>'); }
                } else if (type === 'hex' && action === 'encode') {
                    const r = Array.from(text).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
                    this.addCopyable('  ' + r, r);
                } else if (type === 'hex' && action === 'decode') {
                    try {
                        const r = text.replace(/\s/g, '').match(/.{1,2}/g).map(b => String.fromCharCode(parseInt(b, 16))).join('');
                        this.addCopyable('  ' + escapeHtml(r), r);
                    } catch (e) { this.addLine('  <span class="line-error">invalid hex</span>'); }
                } else if (type === 'url' && action === 'encode') {
                    const r = encodeURIComponent(text);
                    this.addCopyable('  ' + r, r);
                } else if (type === 'url' && action === 'decode') {
                    try { const r = decodeURIComponent(text); this.addCopyable('  ' + escapeHtml(r), r); }
                    catch (e) { this.addLine('  <span class="line-error">invalid URL encoding</span>'); }
                } else if (type === 'html' && action === 'encode') {
                    const d = document.createElement('div'); d.textContent = text;
                    this.addCopyable('  ' + d.innerHTML, d.innerHTML);
                } else if (type === 'html' && action === 'decode') {
                    const doc = new DOMParser().parseFromString(text, 'text/html');
                    const decoded = doc.body.textContent;
                    this.addCopyable('  ' + escapeHtml(decoded), decoded);
                } else if (type === 'unicode' && action === 'encode') {
                    const r = Array.from(text).map(c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')).join('');
                    this.addCopyable('  ' + r, r);
                } else if (type === 'unicode' && action === 'decode') {
                    try {
                        const r = text.replace(/\\u([0-9a-fA-F]{4})/g, (m, hex) => String.fromCharCode(parseInt(hex, 16)));
                        this.addCopyable('  ' + escapeHtml(r), r);
                    } catch (e) { this.addLine('  <span class="line-error">invalid unicode</span>'); }
                } else if (type === 'rot13') {
                    const input = action ? [action, ...rest].join(' ') : '';
                    const r = input.replace(/[a-zA-Z]/g, c => {
                        const base = c <= 'Z' ? 65 : 97;
                        return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
                    });
                    this.addCopyable('  ' + escapeHtml(r), r);
                } else if (type === 'binary' && action === 'encode') {
                    const r = Array.from(text).map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
                    this.addCopyable('  ' + r, r);
                } else if (type === 'binary' && action === 'decode') {
                    try {
                        const r = text.split(/\s+/).map(b => String.fromCharCode(parseInt(b, 2))).join('');
                        this.addCopyable('  ' + escapeHtml(r), r);
                    } catch (e) { this.addLine('  <span class="line-error">invalid binary</span>'); }
                } else if (type === 'all') {
                    const input = action ? [action, ...rest].join(' ') : '';
                    const b64 = btoa(input);
                    const hexStr = Array.from(input).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
                    const urlEnc = encodeURIComponent(input);
                    const d = document.createElement('div'); d.textContent = input;
                    const htmlEnc = d.innerHTML;
                    const uniEnc = Array.from(input).map(c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')).join('');
                    this.addLine('  <span class="line-bright">base64:</span>');
                    this.addCopyable('    ' + b64, b64);
                    this.addLine('  <span class="line-bright">hex:</span>');
                    this.addCopyable('    ' + hexStr, hexStr);
                    this.addLine('  <span class="line-bright">url:</span>');
                    this.addCopyable('    ' + urlEnc, urlEnc);
                    this.addLine('  <span class="line-bright">html:</span>');
                    this.addCopyable('    ' + htmlEnc, htmlEnc);
                    this.addLine('  <span class="line-bright">unicode:</span>');
                    this.addCopyable('    ' + uniEnc, uniEnc);
                } else {
                    this.addLine("  type 'help' for usage.");
                }
                this.addLine('');
            }
        }

        class CryptoKitTool extends ToolBase {
            constructor() {
                super('crypto-kit');
                this.completions = ['hmac', 'aes', 'keygen', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  crypto kit', cls: 'line-bright' },
                    '  <span class="dim">HMAC, AES-256-GCM, key generation</span>',
                    null,
                    '  commands:',
                    '    hmac [key --] &lt;text&gt;             HMAC-SHA256 (custom key with --)',
                    '    keygen [bits]                     random hex key (128/256/512)',
                    '    aes encrypt &lt;text&gt;               AES-256-GCM encrypt',
                    '    aes decrypt &lt;cipher&gt; &lt;iv&gt; &lt;key&gt; AES-256-GCM decrypt',
                    '    help, ?                           show this help',
                    '    exit, q                           return to main shell',
                    null,
                ];
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const parts = cmd.split(/\s+/);
                const [action, sub, ...rest] = parts;
                const text = sub ? [sub, ...rest].join(' ') : '';
                const toHex = arr => Array.from(new Uint8Array(arr)).map(b => b.toString(16).padStart(2, '0')).join('');
                const fromHex = hex => new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                if (action === 'keygen') {
                    const bits = parseInt(sub) || 256;
                    const validBits = [128, 256, 512].includes(bits) ? bits : 256;
                    const bytes = crypto.getRandomValues(new Uint8Array(validBits / 8));
                    const hexKey = toHex(bytes);
                    this.addLine('');
                    this.addLine(`  <span class="line-bright">${validBits}-bit key:</span>`);
                    this.addCopyable('  ' + hexKey, hexKey);
                    this.addLine(`  <span class="dim">${validBits / 8} bytes</span>`);
                    this.addLine('');
                } else if (action === 'hmac' && text) {
                    let hmacKey, hmacText;
                    const sepIdx = text.indexOf(' -- ');
                    if (sepIdx >= 0) {
                        hmacKey = text.slice(0, sepIdx);
                        hmacText = text.slice(sepIdx + 4);
                    } else {
                        hmacKey = 'penumbra-forge';
                        hmacText = text;
                    }
                    const enc = new TextEncoder();
                    crypto.subtle.importKey('raw', enc.encode(hmacKey), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
                        .then(k => crypto.subtle.sign('HMAC', k, enc.encode(hmacText)))
                        .then(sig => {
                            const hex = toHex(sig);
                            this.addLine('');
                            this.addLine('  <span class="line-bright">HMAC-SHA256:</span>');
                            this.addCopyable('  ' + hex, hex);
                            this.addLine(`  <span class="dim">key: ${escapeHtml(hmacKey)}</span>`);
                            this.addLine('  <span class="dim">tip: hmac &lt;key&gt; -- &lt;text&gt; for custom key</span>');
                            this.addLine('');
                        });
                } else if (action === 'aes' && sub === 'encrypt' && rest.length) {
                    const plaintext = rest.join(' ');
                    const enc = new TextEncoder();
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt'])
                        .then(key => Promise.all([
                            crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext)),
                            crypto.subtle.exportKey('raw', key)
                        ]))
                        .then(([ct, rawKey]) => {
                            this.addLine('');
                            this.addLine('  <span class="line-bright">AES-256-GCM encrypted:</span>');
                            this.addCopyable('  cipher: ' + toHex(ct), toHex(ct));
                            this.addCopyable('  iv:     ' + toHex(iv), toHex(iv));
                            this.addCopyable('  key:    ' + toHex(rawKey), toHex(rawKey));
                            this.addLine('  <span class="dim">decrypt: aes decrypt &lt;cipher&gt; &lt;iv&gt; &lt;key&gt;</span>');
                            this.addLine('');
                        });
                } else if (action === 'aes' && sub === 'decrypt' && rest.length >= 3) {
                    const [cipherHex, ivHex, keyHex] = rest;
                    try {
                        const cipherData = fromHex(cipherHex);
                        const ivData = fromHex(ivHex);
                        const keyData = fromHex(keyHex);
                        crypto.subtle.importKey('raw', keyData, { name: 'AES-GCM' }, false, ['decrypt'])
                            .then(key => crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivData }, key, cipherData))
                            .then(pt => {
                                const decoded = new TextDecoder().decode(pt);
                                this.addLine('');
                                this.addLine('  <span class="line-success">decrypted:</span>');
                                this.addCopyable('  ' + escapeHtml(decoded), decoded);
                                this.addLine('');
                            })
                            .catch(() => {
                                this.addLine('  <span class="line-error">decryption failed — wrong key, iv, or corrupted data</span>');
                                this.addLine('');
                            });
                    } catch (e) {
                        this.addLine('  <span class="line-error">invalid hex input</span>');
                        this.addLine('');
                    }
                } else if (action === 'hmac' || action === 'aes') {
                    this.addLine('');
                    this.addLine('  usage: see help for full command list');
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
        }

                    const rating = entropy < 40 ? 'weak' : entropy < 60 ? 'fair' : entropy < 80 ? 'good' : entropy < 128 ? 'strong' : 'excellent';
                    const cls = entropy < 60 ? 'line-error' : entropy < 80 ? 'line-bright' : 'line-success';
                    this.addCopyable('  ' + pwd, pwd);
                    this.addLine(`  <span class="dim">entropy: ${entropy} bits &middot; <span class="${cls}">${rating}</span></span>`);
                    this.addLine('');
                } else if (action === 'passphrase') {
                    const count = parseInt(rest[0]) || 6;
                    const words = [];
                    const arr = new Uint32Array(count);
                    crypto.getRandomValues(arr);
                    for (let i = 0; i < count; i++) {
                        words.push(this.wordlist[arr[i] % this.wordlist.length]);
                    }
                    const phrase = words.join('-');
                    const entropy = Math.round(count * Math.log2(this.wordlist.length));
                    this.addCopyable('  ' + phrase, phrase);
                    this.addLine(`  <span class="dim">entropy: ${entropy} bits &middot; ${count} words from ${this.wordlist.length}-word list</span>`);
                    this.addLine('');
                } else if (action === 'batch') {
                    const count = Math.min(parseInt(rest[0]) || 5, 20);
                    const len = parseInt(rest[1]) || this.length;
                    this.addLine('');
                    for (let i = 0; i < count; i++) {
                        const pwd = this.generatePassword(len);
                        this.addCopyable(`  ${String(i+1).padStart(2)}. ${pwd}`, pwd);
                    }
                    this.addLine('');
                } else if (action === 'strength' && rest.length) {
                    const pwd = rest.join(' ');
                    let score = 0;
                    const fb = [];
                    if (pwd.length >= 8) score++; else fb.push('too short (< 8)');
                    if (pwd.length >= 16) score++;
                    if (/[a-z]/.test(pwd)) score++;
                    if (/[A-Z]/.test(pwd)) score++; else fb.push('no uppercase');
                    if (/[0-9]/.test(pwd)) score++; else fb.push('no digits');
                    if (/[^a-zA-Z0-9]/.test(pwd)) score++; else fb.push('no symbols');
                    const labels = ['very weak','weak','fair','good','strong','very strong','excellent'];
                    const cls = score <= 2 ? 'line-error' : score <= 4 ? 'line-bright' : 'line-success';
                    this.addLine(`  <span class="${cls}">${labels[Math.min(score, labels.length-1)]}</span> (${score}/6)`);
                    this.addLine(`  <span class="dim">entropy: ~${Math.round(pwd.length * 4.7)} bits</span>`);
                    if (fb.length) this.addLine('  <span class="dim">' + fb.join(', ') + '</span>');
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
            generatePassword(len) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
                let pwd = '';
                const arr = new Uint8Array(len);
                crypto.getRandomValues(arr);
                for (let i = 0; i < len; i++) {
                    pwd += chars[arr[i] % chars.length];
                }
                return pwd;
            }
        }

        class RandomKitTool extends ToolBase {
            constructor() {
                super('random-kit');
                this.completions = ['int', 'hex', 'uuid', 'shuffle', 'pick', 'help', '?', 'exit', 'q'];
                this.helpText = [
                    { text: '  random kit', cls: 'line-bright' },
                    '  <span class="dim">UUID, numbers, strings, shuffle, dice</span>',
                    null,
                    '  commands:',
                    '    int &lt;min&gt; &lt;max&gt;       random integer in range',
                    '    hex [len]             random hex (default 16)',
                    '    uuid                  generate UUID v4',
                    '    shuffle &lt;items...&gt;    shuffle words/characters',
                    '    pick &lt;n&gt; &lt;items...&gt;  random selection from list',
                    '    help, ?               show this help',
                    '    exit, q               return to main shell',
                    null,
                ];
            }
            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }
                if (cmd === 'help' || cmd === '?') { this.displayHelp(); return; }
                const [action, ...rest] = cmd.split(/\s+/);
                if (action === 'int') {
                    const min = parseInt(rest[0]) || 0;
                    const max = parseInt(rest[1]) || 100;
                    const range = max - min + 1;
                    const bytes = crypto.getRandomValues(new Uint32Array(1));
                    const result = min + (bytes[0] % range);
                    this.addCopyable('  ' + result, String(result));
                    this.addLine('');
                } else if (action === 'uuid') {
                    const bytes = crypto.getRandomValues(new Uint8Array(16));
                    bytes[6] = (bytes[6] & 0x0f) | 0x40;
                    bytes[8] = (bytes[8] & 0x3f) | 0x80;
                    const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
                    const uuid = `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
                    this.addCopyable('  ' + uuid, uuid);
                    this.addLine('');
                } else if (action === 'hex') {
                    const len = parseInt(rest[0]) || 16;
                    const bytes = crypto.getRandomValues(new Uint8Array(len));
                    const hexStr = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
                    this.addCopyable('  ' + hexStr, hexStr);
                    this.addLine('');
                } else if (action === 'shuffle') {
                    const text = rest.join(' ');
                    const chars = text.split('');
                    for (let i = chars.length-1; i > 0; i--) {
                        const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i+1);
                        [chars[i], chars[j]] = [chars[j], chars[i]];
                    }
                    this.addCopyable('  ' + chars.join(''), chars.join(''));
                    this.addLine('');
                } else if (action === 'pick') {
                    const n = parseInt(rest[0]) || 1;
                    const items = rest.slice(1);
                    if (items.length === 0) {
                        this.addLine('  usage: pick &lt;n&gt; &lt;items...&gt;');
                    } else {
                        const shuffled = [...items];
                        for (let i = shuffled.length-1; i > 0; i--) {
                            const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i+1);
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        const picked = shuffled.slice(0, Math.min(n, items.length)).join(', ');
                        this.addCopyable('  ' + picked, picked);
                    }
                    this.addLine('');
                } else {
                    this.addLine("  type 'help' for usage.");
                }
            }
        }

        class DataFormatKitTool extends ToolBase {
            constructor() {

                this.helpText = [
                    { text: '  data format kit', cls: 'line-bright' },
                    '  <span class="dim">JSON, CSV, case conversion</span>',
                    null,
                    '  commands:',
                    '    json validate &lt;json&gt;             check if valid',
                    '    json format &lt;json&gt;               pretty-print with highlighting',
                    '    json path &lt;path&gt; &lt;json&gt;         extract by dot notation',

                    '    json diff &lt;json1&gt; -- &lt;json2&gt;    compare two JSON objects',
                    '    json schema &lt;json&gt;              infer schema from sample',
                    '    csv2json &lt;text&gt;                  convert CSV to JSON',

            handleInput(cmd) {
                if (cmd === 'exit' || cmd === 'q') { this.hide(); return; }

                const parts = cmd.split(/\s+/);

                this.addLine('');
