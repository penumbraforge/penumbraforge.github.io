name = "site-score"
main = "worker.js"
compatibility_date = "2026-03-22"
account_id = "e32f51ad99dc43fb5249086282786c6f"

[vars]
ALLOWED_ORIGIN = "https://penumbraforge.com"
# TURNSTILE_SECRET is set via `npx wrangler secret put TURNSTILE_SECRET`

# Per-IP burst limit (native binding) — layered with the in-worker hourly cap.
[[ratelimits]]
name = "RL_BURST"
namespace_id = "1004"
[ratelimits.simple]
limit = 5
period = 60
